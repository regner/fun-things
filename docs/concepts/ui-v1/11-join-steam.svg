97" r="7" fill="#8AB8FF"/><text x="104" y="402" font-size="13" fill="#0C222B" font-weight="800" text-anchor="middle">2</text><text x="132" y="401" font-size="24" fill="#F6F1DC" font-weight="650" >Mika</text><text x="132" y="430" font-size="17" fill="#AEC3C6" font-weight="400" >Free roam · 2 / 4 players</text><rect x="646" y="385" width="140" height="52" rx="10" fill="#FF725D" stroke="#45616B" /><text x="666" y="418.0" font-size="22" fill="#0C222B" font-weight="650" >Join</text><text x="756" y="418.0" font-size="24" fill="#0C222B" font-weight="600" text-anchor="middle">→</text><rect x="72" y="469" width="736" height="84" rx="10" fill="#0C222B" stroke="#45616B" /><circle cx="104" cy="497" r="10" fill="#0C222B" stroke="#F6F1DC" stroke-width="2"/><circle cx="104" cy="497" r="7" fill="#80D4C5"/><text x="104" y="502" font-size="13" fill="#0C222B" font-weight="800" text-anchor="middle">3</text><text x="132" y="501" font-size="24" fill="#F6F1DC" font-weight="650" >Jules</text><text x="132" y="530" font-size="17" fill="#AEC3C6" font-weight="400" >Free roam · 4 / 4 players</text><rect x="646" y="493" width="140" height="36" rx="8" fill="#0C222B" stroke="#45616B" /><text x="660" y="517" font-size="16" fill="#AEC3C6" font-weight="600" >Full</text><text x="76" y="625" font-size="18" fill="#AEC3C6" font-weight="400" >Steam invites use this same join flow.</text><rect x="864" y="304" width="368" height="374" rx="12" fill="#102F3A" stroke="#45616B" /><text x="888" y="342" font-size="14" fill="#FFC05A" font-weight="650" letter-spacing="1.6">NOT CONNECTED YET</text><text x="888" y="385" font-size="23" fill="#F6F1DC" font-weight="700" >A lobby is not a match.</text><text x="888" y="427" font-size="17" fill="#AEC3C6" font-weight="400" >After Join: connect, receive current</text><text x="888" y="456" font-size="17" fill="#AEC3C6" font-weight="400" >world state, then enable control.</text><text x="888" y="510" font-size="17" fill="#AEC3C6" font-weight="400" >Future adapter only. Current M1</text><text x="888" y="539" font-size="17" fill="#AEC3C6" font-weight="400" >has no Steam features or testing.</text><rect x="48" y="708" width="200" height="48" rx="10" fill="#102F3A" stroke="#45616B" /><text x="68" y="739.0" font-size="22" fill="#F6F1DC" font-weight="650" >Back</text><text x="276" y="739" font-size="18" fill="#AEC3C6" font-weight="400" >Focus → friend row → Join. Back cancels the attempt.</text><text x="40" y="774" font-size="12" fill="#AEC3C6" font-weight="650" letter-spacing="1.6">CURRENT M1: ENET ONLY · NO STEAM FEATURES OR TESTING NOW</text><text x="1240" y="774" font-size="14" fill="#AEC3C6" font-weight="500" text-anchor="end">1280 × 800</text>
