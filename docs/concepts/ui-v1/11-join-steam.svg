<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
<title id="title">FUTURE ADAPTER EXPLORATION · Steam friends join</title>
<desc id="description">FUTURE ADAPTER EXPLORATION only. Current M1 is ENet-only; no Steam-specific features or testing now. Retained to inform a later session/transport adapter, not current implementation scope. Friends-list concept with one available and one full session, refresh and useful offline/ENet fallback. Lobby membership does not imply gameplay admission. No native Steam functionality is demonstrated. Concept mockup only; numbers, names and connection states are illustrative.</desc>
