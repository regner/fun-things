<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
<title id="title">Current M1 · ENet-only lobby</title>
<desc id="description">Host lobby with three connected sample players and an empty fourth slot. No ready-state mechanic or teams added. Only the host starts. Current M1 is ENet-only; share an explicit address and port. No Steam invite action. Concept mockup only; numbers, names and connection states are illustrative.</desc>
