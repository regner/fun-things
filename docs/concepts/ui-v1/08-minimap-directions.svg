<title id="title">Minimap · three native-size directions</title>
<desc id="description">Minimal, roads-and-blocks, and atlas maps at 160, 200 and 240 pixels respectively. Local player, three numbered peers, cars, explosion and wreck symbol key. Fixed north-up; no gameplay map rotation proposed. Concept mockup only; numbers, names and connection states are illustrative.</desc>
