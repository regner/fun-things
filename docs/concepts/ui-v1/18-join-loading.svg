<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
<title id="title">Join · current-state admission and cancel</title>
<desc id="description">Joining concept distinguishes transport connection, current-world installation and control admission, with cancel always reachable. No false percentage or estimated time. Steam and ENet reuse the flow. Concept mockup only; numbers, names and connection states are illustrative.</desc>
