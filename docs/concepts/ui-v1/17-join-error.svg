<title id="title">Connection · direct ENet unreachable</title>
<desc id="description">Unreachable direct ENet join allows editing or retrying, after cleanup of the old attempt. Full and incompatible variants should keep the same layout with accurate causes. Concept mockup only; numbers, names and connection states are illustrative.</desc>
