<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
<title id="title">Current M1 · ENet-only host</title>
<desc id="description">Current/default host presentation uses ENet only, with an explicit port. No Steam selector or Steam-specific feature. The prior Steam host study is preserved separately as future adapter exploration. Concept mockup only; numbers, names and connection states are illustrative.</desc>
<defs>
<linearGradient id="menu-shade"><stop stop-color="#0C222B"/><stop offset="0.53" stop-color="#0C222B" stop-opacity=".94"/><stop offset="1" stop-color="#0C222B" stop-opacity=".08"/></linearGradient>
<linearGradient id="edge-shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0C222B" stop-opacity="0"/><stop offset="1" stop-color="#0C222B" stop-opacity=".92"/></linearGradient>
<radialGradient id="damage-shade"><stop offset=".62" stop-color="#FF725D" stop-opacity="0"/><stop offset="1" stop-color="#FF725D" stop-opacity=".36"/></radialGradient>
</defs>
<g font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="800" rx="0" fill="#0C222B" /><path d="M960 -30 V160 Q960 208 1008 208 H1300 M1090 -30 V88 H1300 M1300 530 H1080 Q1016 530 1016 594 V850" fill="none" stroke="#1A3F49" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" /><text x="48" y="48" font-size="14" fill="#FF725D" font-weight="650" letter-spacing="1.6">FUN THINGS</text><text x="1232" y="48" font-size="14" fill="#AEC3C6" font-weight="650" letter-spacing="1.6" text-anchor="end">CURRENT M1 / ENET HOST</text><text x="48" y="121" font-size="46" fill="#F6F1DC" font-weight="750" >Make some room.</text><text x="48" y="160" font-size="20" fill="#AEC3C6" font-weight="400" >Current M1 is ENet-only. Host on an explicit port; share your address with friends.</text><path d="M48 190 L1232 190" fill="none" stroke="#45616B" stroke-width="1" /><rect x="48" y="224" width="370" height="36" rx="8" fill="#0C222B" stroke="#45616B" /><text x="62" y="248" font-size="16" fill="#FFC05A" font-weight="600" >DIRECT ENET · CURRENT M1</text><rect x="48" y="310" width="756" height="374" rx="12" fill="#102F3A" stroke="#45616B" /><text x="76" y="347" font-size="14" fill="#FF725D" font-weight="650" letter-spacing="1.6">HOST A DIRECT GAME</text><text x="76" y="391" font-size="30" fill="#F6F1DC" font-weight="700" >Room for four. No service required.</text><text x="76" y="440" font-size="14" fill="#F6F1DC" font-weight="650" letter-spacing="1.6">PORT</text><rect x="76" y="458" width="224" height="60" rx="8" fill="#0C222B" stroke="#FFC05A" stroke-width="3"/><text x="96" y="498" font-size="26" fill="#F6F1DC" font-weight="400" >24900</text><text x="330" y="497" font-size="18" fill="#AEC3C6" font-weight="400" >Example port · up to 4 players including you</text><text x="76" y="559" font-size="20" fill="#AEC3C6" font-weight="400" >When you leave, the match ends for everyone.</text><rect x="76" y="604" width="700" height="56" rx="10" fill="#FF725D" stroke="#45616B" /><text x="96" y="639.0" font-size="22" fill="#0C222B" font-weight="650" >Create ENet lobby</text><text x="746" y="639.0" font-size="24" fill="#0C222B" font-weight="600" text-anchor="middle">→</text><rect x="836" y="224" width="396" height="460" rx="12" fill="#102F3A" stroke="#45616B" /><text x="860" y="261" font-size="14" fill="#F6F1DC" font-weight="650" letter-spacing="1.6">DIRECT CONNECTION</text><text x="860" y="300" font-size="26" fill="#F6F1DC" font-weight="700" >Share the address</text><text x="860" y="345" font-size="18" fill="#AEC3C6" font-weight="400" >Friends enter your address and port.</text><text x="860" y="384" font-size="18" fill="#AEC3C6" font-weight="400" >No server browser or automatic</text><text x="860" y="413" font-size="18" fill="#AEC3C6" font-weight="400" >internet port forwarding.</text><text x="860" y="478" font-size="18" fill="#AEC3C6" font-weight="400" >Current M1 has no Steam features</text><text x="860" y="507" font-size="18" fill="#AEC3C6" font-weight="400" >or Steam-specific testing.</text><text x="860" y="579" font-size="18" fill="#AEC3C6" font-weight="400" >Future adapter studies are separate</text><text x="860" y="608" font-size="18" fill="#AEC3C6" font-weight="400" >concept sheets, not selectable tabs.</text><rect x="48" y="708" width="200" height="48" rx="10" fill="#102F3A" stroke="#45616B" /><text x="68" y="739.0" font-size="22" fill="#F6F1DC" font-weight="650" >Back</text><text x="276" y="739" font-size="18" fill="#AEC3C6" font-weight="400" >Direct ENet is the only current multiplayer path.</text><text x="40" y="774" font-size="12" fill="#AEC3C6" font-weight="650" letter-spacing="1.6">UI V1 · CONCEPT ONLY</text><text x="1240" y="774" font-size="14" fill="#AEC3C6" font-weight="500" text-anchor="end">1280 × 800</text>
</g>
