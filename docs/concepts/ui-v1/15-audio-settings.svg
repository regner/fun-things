<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
<title id="title">Settings · audio only</title>
<desc id="description">Master, Music and SFX volume sliders plus a global mute control. Focused master slider has an amber outline. Values are illustrative. No graphics, input-rebinding, accessibility or gameplay settings are added to M1. Concept mockup only; numbers, names and connection states are illustrative.</desc>
<defs>
<linearGradient id="menu-shade"><stop stop-color="#0C222B"/><stop offset="0.53" stop-color="#0C222B" stop-opacity=".94"/><stop offset="1" stop-color="#0C222B" stop-opacity=".08"/></linearGradient>
<linearGradient id="edge-shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0C222B" stop-opacity="0"/><stop offset="1" stop-color="#0C222B" stop-opacity=".92"/></linearGradient>
<radialGradient id="damage-shade"><stop offset=".62" stop-color="#FF725D" stop-opacity="0"/><stop offset="1" stop-color="#FF725D" stop-opacity=".36"/></radialGradient>
</defs>
<g font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="800" rx="0" fill="#0C222B" /><path d="M960 -30 V160 Q960 208 1008 208 H1300 M1090 -30 V88 H1300 M1300 530 H1080 Q1016 530 1016 594 V850" fill="none" stroke="#1A3F49" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" /><text x="48" y="48" font-size="14" fill="#FF725D" font-weight="650" letter-spacing="1.6">FUN THINGS</text><text x="1232" y="48" font-size="14" fill="#AEC3C6" font-weight="650" letter-spacing="1.6" text-anchor="end">SETTINGS / AUDIO</text><text x="48" y="121" font-size="46" fill="#F6F1DC" font-weight="750" >Turn it up. Or don’t.</text><text x="48" y="160" font-size="20" fill="#AEC3C6" font-weight="400" >M1 settings: audio only. Changes preview locally and are saved on this device.</text><path d="M48 190 L1232 190" fill="none" stroke="#45616B" stroke-width="1" /><rect x="48" y="220" width="776" height="446" rx="12" fill="#102F3A" stroke="#45616B" /><text x="76" y="273" font-size="24" fill="#F6F1DC" font-weight="650" >Master</text><text x="788" y="273" font-size="24" fill="#F6F1DC" font-weight="700" text-anchor="end">80%</text><rect x="76" y="307" width="712" height="8" rx="4" fill="#071920" /><rect x="76" y="307" width="569.6" height="8" rx="4" fill="#80D4C5" /><circle cx="645.6" cy="311" r="12" fill="#F6F1DC"/><rect x="64" y="243" width="738" height="96" rx="10" fill="none" stroke="#FFC05A" stroke-width="3"/><text x="76" y="390" font-size="24" fill="#F6F1DC" font-weight="650" >Music</text><text x="788" y="390" font-size="24" fill="#F6F1DC" font-weight="700" text-anchor="end">45%</text><rect x="76" y="424" width="712" height="8" rx="4" fill="#071920" /><rect x="76" y="424" width="320.4" height="8" rx="4" fill="#80D4C5" /><circle cx="396.4" cy="428" r="12" fill="#F6F1DC"/><text x="76" y="507" font-size="24" fill="#F6F1DC" font-weight="650" >SFX</text><text x="788" y="507" font-size="24" fill="#F6F1DC" font-weight="700" text-anchor="end">100%</text><rect x="76" y="541" width="712" height="8" rx="4" fill="#071920" /><rect x="76" y="541" width="712.0" height="8" rx="4" fill="#80D4C5" /><circle cx="788.0" cy="545" r="12" fill="#F6F1DC"/><rect x="856" y="220" width="376" height="446" rx="12" fill="#102F3A" stroke="#45616B" /><text x="884" y="260" font-size="14" fill="#F6F1DC" font-weight="650" letter-spacing="1.6">MUTE ALL</text><rect x="884" y="282" width="116" height="48" rx="24" fill="#0C222B" stroke="#45616B" /><circle cx="908" cy="306" r="16" fill="#F6F1DC"/><text x="1020" y="314" font-size="22" fill="#F6F1DC" font-weight="650" >Off</text><path d="M884 360 L1204 360" fill="none" stroke="#45616B" stroke-width="1" /><text x="884" y="405" font-size="18" fill="#AEC3C6" font-weight="400" >Left / right adjusts the focused</text><text x="884" y="436" font-size="18" fill="#AEC3C6" font-weight="400" >slider. Confirm toggles mute.</text><text x="884" y="495" font-size="18" fill="#FFC05A" font-weight="400" >Online world keeps running.</text><text x="884" y="526" font-size="18" fill="#AEC3C6" font-weight="400" >No gameplay settings here.</text><text x="884" y="596" font-size="18" fill="#80D4C5" font-weight="600" >Saved locally</text><rect x="48" y="708" width="200" height="48" rx="10" fill="#102F3A" stroke="#45616B" /><text x="68" y="739.0" font-size="22" fill="#F6F1DC" font-weight="650" >Back</text><text x="276" y="739" font-size="18" fill="#AEC3C6" font-weight="400" >No Apply button; volume changes preview immediately.</text><text x="40" y="774" font-size="12" fill="#AEC3C6" font-weight="650" letter-spacing="1.6">UI V1 · CONCEPT ONLY</text><text x="1240" y="774" font-size="14" fill="#AEC3C6" font-weight="500" text-anchor="end">1280 × 800</text>
</g>
