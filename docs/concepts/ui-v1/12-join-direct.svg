25D" stroke="#45616B" /><text x="96" y="627.0" font-size="22" fill="#0C222B" font-weight="650" >Connect</text><text x="742" y="627.0" font-size="24" fill="#0C222B" font-weight="600" text-anchor="middle">→</text><rect x="832" y="304" width="400" height="372" rx="12" fill="#102F3A" stroke="#45616B" /><text x="856" y="344" font-size="12" fill="#FF725D" font-weight="650" letter-spacing="1.6">KNOWN ADDRESS, NOT DISCOVERY</text><text x="856" y="389" font-size="18" fill="#F6F1DC" font-weight="400" >Ask your host for both fields.</text><text x="856" y="428" font-size="18" fill="#F6F1DC" font-weight="400" >Same LAN or a reachable address.</text><text x="856" y="467" font-size="18" fill="#F6F1DC" font-weight="400" >No automatic NAT traversal.</text><text x="856" y="538" font-size="18" fill="#AEC3C6" font-weight="400" >Desktop keyboard entry for M1.</text><text x="856" y="567" font-size="18" fill="#AEC3C6" font-weight="400" >Handheld/on-screen keyboard</text><text x="856" y="596" font-size="18" fill="#AEC3C6" font-weight="400" >layout is a later study.</text><rect x="48" y="708" width="200" height="48" rx="10" fill="#102F3A" stroke="#45616B" /><text x="68" y="739.0" font-size="22" fill="#F6F1DC" font-weight="650" >Back</text><text x="276" y="739" font-size="18" fill="#AEC3C6" font-weight="400" >Sample address only. Enter → connect; Esc → back.</text><text x="40" y="774" font-size="12" fill="#AEC3C6" font-weight="650" letter-spacing="1.6">UI V1 · CONCEPT ONLY</text><text x="1240" y="774" font-size="14" fill="#AEC3C6" font-weight="500" text-anchor="end">1280 × 800</text>
