<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
<title id="title">FUTURE ADAPTER EXPLORATION · Steam host</title>
<desc id="description">FUTURE ADAPTER EXPLORATION only. Current M1 is ENet-only; no Steam-specific features or testing now. Retained to inform a later session/transport adapter, not current implementation scope. Steam tab selected. Right-hand card is annotated alternate ENet tab content for comparison, not a second concurrent connection. Port is an example, not a new networking default. Concept mockup only; numbers, names and connection states are illustrative.</desc>
<defs>
<linearGradient id="menu-shade"><stop stop-color="#0C222B"/><stop offset="0.53" stop-color="#0C222B" stop-opacity=".94"/><stop offset="1" stop-color="#0C222B" stop-opacity=".08"/></linearGradient>
<linearGradient id="edge-shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0C222B" stop-opacity="0"/><stop offset="1" stop-color="#0C222B" stop-opacity=".92"/></linearGradient>
<radialGradient id="damage-shade"><stop offset=".62" stop-color="#FF725D" stop-opacity="0"/><stop offset="1" stop-color="#FF725D" stop-opacity=".36"/></radialGradient>
</defs>
<g font-family="Segoe UI, system-ui, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="800" rx="0" fill="#0C222B" /><path d="M960 -30 V160 Q960 208 1008 208 H1300 M1090 -30 V88 H1300 M1300 530 H1080 Q1016 530 1016 594 V850" fill="none" stroke="#1A3F49" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" /><text x="48" y="48" font-size="14" fill="#FFC05A" font-weight="650" letter-spacing="1.6">FUTURE ADAPTER EXPLORATION</text><text x="1232" y="48" font-size="14" fill="#AEC3C6" font-weight="650" letter-spacing="1.6" text-anchor="end">PLAY / HOST</text><text x="48" y="121" font-size="46" fill="#F6F1DC" font-weight="750" >Make some room.</text><text x="48" y="160" font-size="20" fill="#AEC3C6" font-weight="400" >Choose a connection before creating the session. Up to four players, including you.</text><path d="M48 190 L1232 190" fill="none" stroke="#45616B" stroke-width="1" /><rect x="48" y="224" width="366" height="56" rx="10" fill="#FF725D" stroke="#45616B" /><rect x="44" y="220" width="374" height="64" rx="14" fill="none" stroke="#FFC05A" stroke-width="3"/><text x="68" y="259.0" font-size="22" fill="#0C222B" font-weight="650" >Steam friends</text><text x="384" y="259.0" font-size="24" fill="#0C222B" font-weight="600" text-anchor="middle">→</text><rect x="438" y="224" width="366" height="56" rx="10" fill="#102F3A" stroke="#45616B" /><text x="458" y="259.0" font-size="22" fill="#F6F1DC" font-weight="650" >Direct ENet</text><rect x="48" y="310" width="756" height="374" rx="12" fill="#102F3A" stroke="#45616B" /><text x="76" y="347" font-size="14" fill="#FF725D" font-weight="650" letter-spacing="1.6">STEAM FRIENDS</text><text x="76" y="391" font-size="30" fill="#F6F1DC" font-weight="700" >Host for your friends</text><text x="76" y="430" font-size="20" fill="#AEC3C6" font-weight="400" >Create a friends lobby, then invite from Steam.</text><text x="76" y="461" font-size="20" fill="#AEC3C6" font-weight="400" >Friends can join after the match has started.</text><path d="M76 490 L774 490" fill="none" stroke="#45616B" stroke-width="1" /><text x="76" y="526" font-size="20" fill="#F6F1DC" font-weight="400" >Players</text><text x="774" y="526" font-size="20" fill="#F6F1DC" font-weight="650" text-anchor="end">1–4 total</text><text x="76" y="565" font-size="20" fill="#F6F1DC" font-weight="400" >When you leave</text><text x="774" y="565" font-size="20" fill="#AEC3C6" font-weight="400" text-anchor="end">The match ends for everyone</text><rect x="76" y="604" width="700" height="56" rx="10" fill="#FF725D" stroke="#45616B" /><text x="96" y="639.0" font-size="22" fill="#0C222B" font-weight="650" >Create Steam lobby</text><text x="746" y="639.0" font-size="24" fill="#0C222B" font-weight="600" text-anchor="middle">→</text><rect x="836" y="224" width="396" height="460" rx="12" fill="#102F3A" stroke="#45616B" /><text x="860" y="261" font-size="14" fill="#F6F1DC" font-weight="650" letter-spacing="1.6">DIRECT ENET / ALTERNATE</text><text x="860" y="300" font-size="26" fill="#F6F1DC" font-weight="700" >No Steam required</text><text x="860" y="340" font-size="18" fill="#AEC3C6" font-weight="400" >Host on a known address and port.</text><text x="860" y="384" font-size="14" fill="#AEC3C6" font-weight="650" letter-spacing="1.6">PORT</text><rect x="860" y="403" width="348" height="54" rx="8" fill="#0C222B" stroke="#45616B" /><text x="880" y="438" font-size="24" fill="#F6F1DC" font-weight="400" >24900</text><text x="860" y="494" font-size="18" fill="#AEC3C6" font-weight="400" >Share your address with friends.</text><text x="860" y="523" font-size="18" fill="#AEC3C6" font-weight="400" >No server browser or automatic</text><text x="860" y="550" font-size="18" fill="#AEC3C6" font-weight="400" >internet port forwarding.</text><text x="860" y="602" font-size="12" fill="#FFC05A" font-weight="650" letter-spacing="1.6">ALTERNATE TAB CONTENT</text><text x="860" y="635" font-size="18" fill="#F6F1DC" font-weight="400" >Action: Create ENet lobby</text><rect x="48" y="708" width="200" height="48" rx="10" fill="#102F3A" stroke="#45616B" /><text x="68" y="739.0" font-size="22" fill="#F6F1DC" font-weight="650" >Back</text><text x="276" y="739" font-size="18" fill="#AEC3C6" font-weight="400" >Connection is locked until you leave the session.</text><text x="40" y="774" font-size="12" fill="#AEC3C6" font-weight="650" letter-spacing="1.6">CURRENT M1: ENET ONLY · NO STEAM FEATURES OR TESTING NOW</text><text x="1240" y="774" font-size="14" fill="#AEC3C6" font-weight="500" text-anchor="end">1280 × 800</text>
