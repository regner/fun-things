<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320"><title>The Crescents — approved district identity brief</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1800" height="1320" rx="0" fill="#102332" stroke="none" stroke-width="1"/><text x="55" y="46" fill="#B5C7D0" font-size="17" font-weight="600">BRACKETT / STAGE 03 / DISTRICT IDENTITY / APPROVED DIRECTION</text><text x="55" y="112" fill="#F4EEDD" font-size="48" font-weight="700">02  The Crescents</text><text x="55" y="160" fill="#FFD2A0" font-size="26" font-weight="400">Small streets with awkward choices</text><text x="55" y="201" fill="#B5C7D0" font-size="19" font-weight="400">Domestic / winding / nosy</text><defs><clipPath id="motif"><rect width="750" height="620" rx="15"/></clipPath></defs><g transform="translate(55 240)" clip-path="url(#motif)"><rect x="0" y="0" width="750" height="620" rx="15" fill="#203644" stroke="none" stroke-width="1"/><path d="M-20 540 C90 520 125 450 150 355 S280 180 385 180 S600 260 775 210" fill="none" stroke="#637383" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 540 C90 520 125 450 150 355 S280 180 385 180 S600 260 775 210" fill="none" stroke="#172D40" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 180 C355 280 455 290 470 375 V435" fill="none" stroke="#637383" stroke-width="51" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 180 C355 280 455 290 470 375 V435" fill="none" stroke="#172D40" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="435" r="42" fill="#172D40" stroke="#637383" stroke-width="8"/><path d="M505 461 C560 520 610 535 720 515" fill="none" stroke="#B9C9BD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 12"/><g transform="rotate(20 87.0 324.5)"><rect x="67" y="299" width="54" height="69" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="60" y="290" width="54" height="69" rx="4" fill="#735D76" stroke="#8296A1" stroke-width="1.5"/><path d="M69 300 H105" fill="none" stroke="#FFD2A0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 324.5 H104" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(35 174.0 170.0)"><rect x="147" y="149" width="68" height="60" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="140" y="140" width="68" height="60" rx="4" fill="#394A67" stroke="#8296A1" stroke-width="1.5"/><path d="M149 150 H199" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 170.0 H198" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(-10 295.0 111.0)"><rect x="247" y="99" width="110" height="42" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="240" y="90" width="110" height="42" rx="4" fill="#394A67" stroke="#8296A1" stroke-width="1.5"/><path d="M249 100 H341" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 111.0 H340" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(15 437.5 93.5)"><rect x="412" y="74" width="65" height="57" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="405" y="65" width="65" height="57" rx="4" fill="#735D76" stroke="#8296A1" stroke-width="1.5"/><path d="M414 75 H461" fill="none" stroke="#FFD2A0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M415 93.5 H460" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(20 576.0 155.0)"><rect x="537" y="139" width="92" height="50" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="530" y="130" width="92" height="50" rx="4" fill="#394A67" stroke="#8296A1" stroke-width="1.5"/><path d="M539 140 H613" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 155.0 H612" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(-5 656.5 332.0)"><rect x="632" y="299" width="63" height="84" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="625" y="290" width="63" height="84" rx="4" fill="#394A67" stroke="#8296A1" stroke-width="1.5"/><path d="M634 300 H679" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M635 332.0 H678" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(-10 321.0 357.5)"><rect x="292" y="324" width="72" height="85" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="285" y="315" width="72" height="85" rx="4" fill="#735D76" stroke="#8296A1" stroke-width="1.5"/><path d="M294 325 H348" fill="none" stroke="#FFD2A0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M295 357.5 H347" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(15 406.0 521.0)"><rect x="367" y="504" width="92" height="52" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="360" y="495" width="92" height="52" rx="4" fill="#394A67" stroke="#8296A1" stroke-width="1.5"/><path d="M369 505 H443" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M370 521.0 H442" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 575.5 443.0)"><rect x="555" y="416" width="55" height="72" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="548" y="407" width="55" height="72" rx="4" fill="#394A67" stroke="#8296A1" stroke-width="1.5"/><path d="M557 417 H594" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M558 443.0 H593" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(-25 160.0 515.5)"><rect x="127" y="494" width="80" height="61" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="120" y="485" width="80" height="61" rx="4" fill="#735D76" stroke="#8296A1" stroke-width="1.5"/><path d="M129 495 H191" fill="none" stroke="#FFD2A0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 515.5 H190" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="75" y="890" fill="#FFD2A0" font-size="16" font-weight="700">ROOF + OPEN-SPACE MOTIF</text><text x="75" y="926" fill="#F4EEDD" font-size="20" font-weight="400">01  Curving street</text><text x="75" y="954" fill="#F4EEDD" font-size="20" font-weight="400">02  Turn-around court</text><text x="75" y="982" fill="#F4EEDD" font-size="20" font-weight="400">03  Walking cut-through</text><text x="75" y="1020" fill="#B5C7D0" font-size="17" font-weight="400">Schematic only: no scale, height or route validation.</text><text x="870" y="260" fill="#FFD2A0" font-size="16" font-weight="700">PLAY</text><text x="870" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Curved driving lines, turn-around</text><text x="870" y="325" fill="#F4EEDD" font-size="20" font-weight="400">courts and on-foot shortcuts. Small</text><text x="870" y="352" fill="#F4EEDD" font-size="20" font-weight="400">parking pockets interrupt otherwise</text><text x="870" y="379" fill="#F4EEDD" font-size="20" font-weight="400">calm residential streets.</text><text x="1315" y="260" fill="#FFD2A0" font-size="16" font-weight="700">ARCHITECTURE</text><text x="1315" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Many small house-and-garden plots</text><text x="1315" y="325" fill="#F4EEDD" font-size="20" font-weight="400">share unequal curved blocks.</text><text x="1315" y="352" fill="#F4EEDD" font-size="20" font-weight="400">Detached, paired and short-row homes</text><text x="1315" y="379" fill="#F4EEDD" font-size="20" font-weight="400">vary in footprint and setback;</text><text x="1315" y="406" fill="#F4EEDD" font-size="20" font-weight="400">occasional corner shops interrupt</text><text x="1315" y="433" fill="#F4EEDD" font-size="20" font-weight="400">them.</text><text x="870" y="510" fill="#FFD2A0" font-size="16" font-weight="700">STREETS + ROUTES</text><text x="870" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Narrow two-way crescents and</text><text x="870" y="575" fill="#F4EEDD" font-size="20" font-weight="400">selected one-way access courts serve</text><text x="870" y="602" fill="#F4EEDD" font-size="20" font-weight="400">small house plots within unequal</text><text x="870" y="629" fill="#F4EEDD" font-size="20" font-weight="400">blocks. Larger streets connect the</text><text x="870" y="656" fill="#F4EEDD" font-size="20" font-weight="400">neighbourhood; foot links join local</text><text x="870" y="683" fill="#F4EEDD" font-size="20" font-weight="400">dead ends.</text><text x="1315" y="510" fill="#FFD2A0" font-size="16" font-weight="700">PROP FAMILIES</text><text x="1315" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Short garden walls, mailboxes, bins</text><text x="1315" y="575" fill="#F4EEDD" font-size="20" font-weight="400">and small porch canopies. Low</text><text x="1315" y="602" fill="#F4EEDD" font-size="20" font-weight="400">planting preserves sightlines</text><text x="1315" y="629" fill="#F4EEDD" font-size="20" font-weight="400">through the shortcuts.</text><text x="870" y="760" fill="#FFD2A0" font-size="16" font-weight="700">LIGHT + ACCENT PLACEMENT</text><text x="870" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Warm porch pools against blue and</text><text x="870" y="825" fill="#F4EEDD" font-size="20" font-weight="400">plum roofs. Electric blue belongs to</text><text x="870" y="852" fill="#F4EEDD" font-size="20" font-weight="400">occasional shops, not every house.</text><text x="1315" y="760" fill="#FFD2A0" font-size="16" font-weight="700">SIGNAGE + HUMOUR</text><text x="1315" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Petty neighbourhood notices. Sign</text><text x="1315" y="825" fill="#F4EEDD" font-size="20" font-weight="400">idea: &#x27;Neighbourhood Watch: Mostly</text><text x="1315" y="852" fill="#F4EEDD" font-size="20" font-weight="400">Curtains&#x27;.</text><rect x="870" y="964" width="28" height="28" rx="4" fill="#394A67" stroke="#8296A1" stroke-width="1"/><text x="910" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Blue roofs</text><rect x="1315" y="964" width="28" height="28" rx="4" fill="#735D76" stroke="#8296A1" stroke-width="1"/><text x="1355" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Muted plum</text><rect x="870" y="1012" width="28" height="28" rx="4" fill="#FFD2A0" stroke="#8296A1" stroke-width="1"/><text x="910" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Porch amber</text><rect x="1315" y="1012" width="28" height="28" rx="4" fill="#7FAEC4" stroke="#8296A1" stroke-width="1"/><text x="1355" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Corner-shop blue</text><path d="M55 1060 H1745" fill="none" stroke="#455B68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="1098" fill="#FFD2A0" font-size="16" font-weight="700">LANDMARK SEED</text><text x="255" y="1098" fill="#F4EEDD" font-size="20" font-weight="400">A small crescent of wedge-shaped gardens around a corner shop, recognised by the curved roof-and-road pattern.</text><text x="55" y="1190" fill="#FFD2A0" font-size="16" font-weight="700">M1 RELATIONSHIP</text><text x="255" y="1190" fill="#F4EEDD" font-size="20" font-weight="400">Reference for domestic details only; M1 housing is a compact mixed-use pocket.</text><text x="55" y="1290" fill="#B5C7D0" font-size="17" font-weight="400">ALL NAMES ARE PLACEHOLDERS • Fixed blue-hour direction • Original 2D concept diagram, not game art</text></g></svg>