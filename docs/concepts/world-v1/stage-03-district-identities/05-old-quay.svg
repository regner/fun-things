<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320"><title>Old Quay — approved district identity brief</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1800" height="1320" rx="0" fill="#102332" stroke="none" stroke-width="1"/><text x="55" y="46" fill="#B5C7D0" font-size="17" font-weight="600">BRACKETT / STAGE 03 / DISTRICT IDENTITY / APPROVED DIRECTION</text><text x="55" y="112" fill="#F4EEDD" font-size="48" font-weight="700">05  Old Quay</text><text x="55" y="160" fill="#FFBD80" font-size="26" font-weight="400">The warm edge of the water</text><text x="55" y="201" fill="#B5C7D0" font-size="19" font-weight="400">Sociable / crooked / proudly municipal</text><defs><clipPath id="motif"><rect width="750" height="620" rx="15"/></clipPath></defs><g transform="translate(55 240)" clip-path="url(#motif)"><rect x="0" y="0" width="750" height="620" rx="15" fill="#203644" stroke="none" stroke-width="1"/><path d="M790 230 Q545 230 490 400 T180 660" fill="none" stroke="#143E55" stroke-width="215" stroke-linecap="round" stroke-linejoin="round"/><path d="M-30 525 Q160 520 330 410 T560 170 Q650 100 780 115" fill="none" stroke="#637383" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/><path d="M-30 525 Q160 520 330 410 T560 170 Q650 100 780 115" fill="none" stroke="#172D40" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(5 58.5 415.0)"><rect x="42" y="379" width="47" height="90" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="35" y="370" width="47" height="90" rx="4" fill="#836977" stroke="#8296A1" stroke-width="1.5"/><path d="M44 380 H73" fill="none" stroke="#FFBD80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 415.0 H72" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(12 132.5 390.0)"><rect x="112" y="349" width="55" height="100" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="105" y="340" width="55" height="100" rx="4" fill="#435B68" stroke="#8296A1" stroke-width="1.5"/><path d="M114 350 H151" fill="none" stroke="#FFBD80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M115 390.0 H150" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(23 203.5 340.0)"><rect x="187" y="294" width="47" height="110" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="180" y="285" width="47" height="110" rx="4" fill="#836977" stroke="#8296A1" stroke-width="1.5"/><path d="M189 295 H218" fill="none" stroke="#FFBD80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 340.0 H217" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(32 292.5 265.0)"><rect x="272" y="229" width="55" height="90" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="265" y="220" width="55" height="90" rx="4" fill="#435B68" stroke="#8296A1" stroke-width="1.5"/><path d="M274 230 H311" fill="none" stroke="#FFBD80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M275 265.0 H310" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(34 383.5 190.0)"><rect x="367" y="149" width="47" height="100" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="360" y="140" width="47" height="100" rx="4" fill="#836977" stroke="#8296A1" stroke-width="1.5"/><path d="M369 150 H398" fill="none" stroke="#FFBD80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M370 190.0 H397" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(15 482.5 115.0)"><rect x="462" y="69" width="55" height="110" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="455" y="60" width="55" height="110" rx="4" fill="#435B68" stroke="#8296A1" stroke-width="1.5"/><path d="M464 70 H501" fill="none" stroke="#FFBD80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M465 115.0 H500" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="70" y="70" width="170" height="125" rx="8" fill="#6D757E" stroke="none" stroke-width="1"/><g transform="rotate(0 150.0 85.5)"><rect x="57" y="66" width="200" height="57" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="50" y="57" width="200" height="57" rx="4" fill="#435B68" stroke="#8296A1" stroke-width="1.5"/><path d="M59 67 H241" fill="none" stroke="#FFBD80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 85.5 H240" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="160" cy="155" r="18" fill="#9BB5B9" stroke="none" stroke-width="1"/><path d="M330 485 Q475 403 543 278" fill="none" stroke="#6F999F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="75" y="890" fill="#FFBD80" font-size="16" font-weight="700">ROOF + OPEN-SPACE MOTIF</text><text x="75" y="926" fill="#F4EEDD" font-size="20" font-weight="400">01  Broken quay frontage</text><text x="75" y="954" fill="#F4EEDD" font-size="20" font-weight="400">02  Civic square</text><text x="75" y="982" fill="#F4EEDD" font-size="20" font-weight="400">03  Open harbour water</text><text x="75" y="1020" fill="#B5C7D0" font-size="17" font-weight="400">Schematic only: no scale, height or route validation.</text><text x="870" y="260" fill="#FFBD80" font-size="16" font-weight="700">PLAY</text><text x="870" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Bending waterfront drives, little</text><text x="870" y="325" fill="#F4EEDD" font-size="20" font-weight="400">civic squares and connected walking</text><text x="870" y="352" fill="#F4EEDD" font-size="20" font-weight="400">passages. Parked-car pockets sit</text><text x="870" y="379" fill="#F4EEDD" font-size="20" font-weight="400">away from the bridge crossing.</text><text x="1315" y="260" fill="#FFBD80" font-size="16" font-weight="700">ARCHITECTURE</text><text x="1315" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Small narrow shop/home plots follow</text><text x="1315" y="325" fill="#F4EEDD" font-size="20" font-weight="400">irregular blocks, interrupted by</text><text x="1315" y="352" fill="#F4EEDD" font-size="20" font-weight="400">larger civic sites. Varied roof</text><text x="1315" y="379" fill="#F4EEDD" font-size="20" font-weight="400">depths and short frontages give the</text><text x="1315" y="406" fill="#F4EEDD" font-size="20" font-weight="400">quay a fine-grained character.</text><text x="870" y="510" fill="#FFBD80" font-size="16" font-weight="700">STREETS + ROUTES</text><text x="870" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Mainly two-lane quay streets,</text><text x="870" y="575" fill="#F4EEDD" font-size="20" font-weight="400">selected one-way lanes and inland</text><text x="870" y="602" fill="#F4EEDD" font-size="20" font-weight="400">alternatives. Small irregular plots</text><text x="870" y="629" fill="#F4EEDD" font-size="20" font-weight="400">alternate with larger civic blocks;</text><text x="870" y="656" fill="#F4EEDD" font-size="20" font-weight="400">the harbour-mouth bridge stays.</text><text x="1315" y="510" fill="#FFBD80" font-size="16" font-weight="700">PROP FAMILIES</text><text x="1315" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Mooring bollards, low quay rails,</text><text x="1315" y="575" fill="#F4EEDD" font-size="20" font-weight="400">civic noticeboards and benches.</text><text x="1315" y="602" fill="#F4EEDD" font-size="20" font-weight="400">Waterfront dressing stays simple and</text><text x="1315" y="629" fill="#F4EEDD" font-size="20" font-weight="400">does not imply boat gameplay.</text><text x="870" y="760" fill="#FFBD80" font-size="16" font-weight="700">LIGHT + ACCENT PLACEMENT</text><text x="870" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Amber frontage and soft teal water</text><text x="870" y="825" fill="#F4EEDD" font-size="20" font-weight="400">contrast with darker slate roofs.</text><text x="870" y="852" fill="#F4EEDD" font-size="20" font-weight="400">Warm pools mark squares rather than</text><text x="870" y="879" fill="#F4EEDD" font-size="20" font-weight="400">tracing every street.</text><text x="1315" y="760" fill="#FFBD80" font-size="16" font-weight="700">SIGNAGE + HUMOUR</text><text x="1315" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Small-city bureaucracy with grand</text><text x="1315" y="825" fill="#F4EEDD" font-size="20" font-weight="400">ambitions. Sign idea: &#x27;Office of</text><text x="1315" y="852" fill="#F4EEDD" font-size="20" font-weight="400">Temporary Permanence&#x27;.</text><rect x="870" y="964" width="28" height="28" rx="4" fill="#435B68" stroke="#8296A1" stroke-width="1"/><text x="910" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Slate roofs</text><rect x="1315" y="964" width="28" height="28" rx="4" fill="#836977" stroke="#8296A1" stroke-width="1"/><text x="1355" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Plum infill</text><rect x="870" y="1012" width="28" height="28" rx="4" fill="#FFBD80" stroke="#8296A1" stroke-width="1"/><text x="910" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Amber frontage</text><rect x="1315" y="1012" width="28" height="28" rx="4" fill="#75D6CF" stroke="#8296A1" stroke-width="1"/><text x="1355" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Waterfront teal</text><path d="M55 1060 H1745" fill="none" stroke="#455B68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="1098" fill="#FFBD80" font-size="16" font-weight="700">LANDMARK SEED</text><text x="255" y="1098" fill="#F4EEDD" font-size="20" font-weight="400">A broad-roofed harbour hall beside a small open square; the bridge and basin remain the larger orientation cues.</text><text x="55" y="1190" fill="#FFBD80" font-size="16" font-weight="700">M1 RELATIONSHIP</text><text x="255" y="1190" fill="#F4EEDD" font-size="20" font-weight="400">Whole-city reference only. The harbour and bridge are not prerequisites for the first playable slice.</text><text x="55" y="1290" fill="#B5C7D0" font-size="17" font-weight="400">ALL NAMES ARE PLACEHOLDERS • Fixed blue-hour direction • Original 2D concept diagram, not game art</text></g></svg>