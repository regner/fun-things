<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320"><title>Ironreach — approved district identity brief</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1800" height="1320" rx="0" fill="#102332" stroke="none" stroke-width="1"/><text x="55" y="46" fill="#B5C7D0" font-size="17" font-weight="600">BRACKETT / STAGE 03 / DISTRICT IDENTITY / APPROVED DIRECTION</text><text x="55" y="112" fill="#F4EEDD" font-size="48" font-weight="700">08  Ironreach</text><text x="55" y="160" fill="#FFBD74" font-size="26" font-weight="400">Where the bright city gets repaired</text><text x="55" y="201" fill="#B5C7D0" font-size="19" font-weight="400">Practical / warm / stubborn</text><defs><clipPath id="motif"><rect width="750" height="620" rx="15"/></clipPath></defs><g transform="translate(55 240)" clip-path="url(#motif)"><rect x="0" y="0" width="750" height="620" rx="15" fill="#203644" stroke="none" stroke-width="1"/><path d="M-20 170 H180 Q245 170 285 215 L410 345 Q445 375 510 375 H775" fill="none" stroke="#637383" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 170 H180 Q245 170 285 215 L410 345 Q445 375 510 375 H775" fill="none" stroke="#172D40" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 650 V355 Q85 300 140 300 H230" fill="none" stroke="#637383" stroke-width="49" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 650 V355 Q85 300 140 300 H230" fill="none" stroke="#172D40" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 375 V510 Q590 552 530 552 H85" fill="none" stroke="#637383" stroke-width="49" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 375 V510 Q590 552 530 552 H85" fill="none" stroke="#172D40" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(0 112.5 76.0)"><rect x="47" y="44" width="145" height="82" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="40" y="35" width="145" height="82" rx="4" fill="#68727B" stroke="#8296A1" stroke-width="1.5"/><path d="M49 45 H176" fill="none" stroke="#FFBD74" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 76.0 H175" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 366.0 98.0)"><rect x="261" y="57" width="224" height="100" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="254" y="48" width="224" height="100" rx="4" fill="#355C65" stroke="#8296A1" stroke-width="1.5"/><path d="M263 58 H469" fill="none" stroke="#FFBD74" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M264 98.0 H468" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 632.5 145.0)"><rect x="567" y="79" width="145" height="150" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="560" y="70" width="145" height="150" rx="4" fill="#68727B" stroke="#8296A1" stroke-width="1.5"/><path d="M569 80 H696" fill="none" stroke="#FFBD74" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M570 145.0 H695" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 218.0 433.0)"><rect x="180" y="364" width="90" height="156" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="173" y="355" width="90" height="156" rx="4" fill="#355C65" stroke="#8296A1" stroke-width="1.5"/><path d="M182 365 H254" fill="none" stroke="#FFBD74" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M183 433.0 H253" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 420.0 466.0)"><rect x="342" y="436" width="170" height="78" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="335" y="427" width="170" height="78" rx="4" fill="#68727B" stroke="#8296A1" stroke-width="1.5"/><path d="M344 437 H496" fill="none" stroke="#FFBD74" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M345 466.0 H495" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M490 375 V245 H720 V375" fill="none" stroke="#637383" stroke-width="37" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 375 V245 H720 V375" fill="none" stroke="#172D40" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><rect x="515" y="274" width="161" height="72" rx="6" fill="#334855" stroke="none" stroke-width="1"/><path d="M523 282 V320 H552 V282" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 282 V320 H589 V282" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="566" y="288" width="17" height="28" rx="4" fill="#C6CECB" stroke="none" stroke-width="1"/><path d="M597 282 V320 H626 V282" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M634 282 V320 H663 V282" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 508 V370 L250 341" fill="none" stroke="#BBD0C8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 10"/></g><text x="75" y="890" fill="#FFBD74" font-size="16" font-weight="700">ROOF + OPEN-SPACE MOTIF</text><text x="75" y="926" fill="#F4EEDD" font-size="20" font-weight="400">01  Unequal shed roofs</text><text x="75" y="954" fill="#F4EEDD" font-size="20" font-weight="400">02  Open two-exit yard</text><text x="75" y="982" fill="#F4EEDD" font-size="20" font-weight="400">03  Connected service route</text><text x="75" y="1020" fill="#B5C7D0" font-size="17" font-weight="400">Schematic only: no scale, height or route validation.</text><text x="870" y="260" fill="#FFBD74" font-size="16" font-weight="700">PLAY</text><text x="870" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Service escapes and the main</text><text x="870" y="325" fill="#F4EEDD" font-size="20" font-weight="400">repair/parking chain yard. Flat</text><text x="870" y="352" fill="#F4EEDD" font-size="20" font-weight="400">aprons support hard turns and</text><text x="870" y="379" fill="#F4EEDD" font-size="20" font-weight="400">evasive driving between linked</text><text x="870" y="406" fill="#F4EEDD" font-size="20" font-weight="400">courts.</text><text x="1315" y="260" fill="#FFBD74" font-size="16" font-weight="700">ARCHITECTURE</text><text x="1315" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Small and medium repair plots mix</text><text x="1315" y="325" fill="#F4EEDD" font-size="20" font-weight="400">with larger depot and yard sites.</text><text x="1315" y="352" fill="#F4EEDD" font-size="20" font-weight="400">Unequal sheds, offset ridges and</text><text x="1315" y="379" fill="#F4EEDD" font-size="20" font-weight="400">small offices leave open working</text><text x="1315" y="406" fill="#F4EEDD" font-size="20" font-weight="400">aprons between buildings.</text><text x="870" y="510" fill="#FFBD74" font-size="16" font-weight="700">STREETS + ROUTES</text><text x="870" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Two-lane working streets mix with</text><text x="870" y="575" fill="#F4EEDD" font-size="20" font-weight="400">narrow service links and generous</text><text x="870" y="602" fill="#F4EEDD" font-size="20" font-weight="400">yard turns. Small repair plots sit</text><text x="870" y="629" fill="#F4EEDD" font-size="20" font-weight="400">beside larger depot sites; the M1</text><text x="870" y="656" fill="#F4EEDD" font-size="20" font-weight="400">chain yard retains two exits and a</text><text x="870" y="683" fill="#F4EEDD" font-size="20" font-weight="400">foot bypass.</text><text x="1315" y="510" fill="#FFBD74" font-size="16" font-weight="700">PROP FAMILIES</text><text x="1315" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Static tool cabinets, tyre racks,</text><text x="1315" y="575" fill="#F4EEDD" font-size="20" font-weight="400">low barriers and grouped service</text><text x="1315" y="602" fill="#F4EEDD" font-size="20" font-weight="400">signs. These are dressing or</text><text x="1315" y="629" fill="#F4EEDD" font-size="20" font-weight="400">obstacles, not new interactive</text><text x="1315" y="656" fill="#F4EEDD" font-size="20" font-weight="400">systems.</text><text x="870" y="760" fill="#FFBD74" font-size="16" font-weight="700">LIGHT + ACCENT PLACEMENT</text><text x="870" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Amber task-light pools on pale</text><text x="870" y="825" fill="#F4EEDD" font-size="20" font-weight="400">aprons, petrol roofs and occasional</text><text x="870" y="852" fill="#F4EEDD" font-size="20" font-weight="400">cyan repair signs. Street fill stays</text><text x="870" y="879" fill="#F4EEDD" font-size="20" font-weight="400">readable beyond the bright work</text><text x="870" y="906" fill="#F4EEDD" font-size="20" font-weight="400">areas.</text><text x="1315" y="760" fill="#FFBD74" font-size="16" font-weight="700">SIGNAGE + HUMOUR</text><text x="1315" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Cheerful compromises in quality.</text><text x="1315" y="825" fill="#F4EEDD" font-size="20" font-weight="400">Sign idea: &#x27;Fixed Enough: Noises</text><text x="1315" y="852" fill="#F4EEDD" font-size="20" font-weight="400">Cost Extra&#x27;.</text><rect x="870" y="964" width="28" height="28" rx="4" fill="#355C65" stroke="#8296A1" stroke-width="1"/><text x="910" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Petrol sheds</text><rect x="1315" y="964" width="28" height="28" rx="4" fill="#68727B" stroke="#8296A1" stroke-width="1"/><text x="1355" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Pale roof bands</text><rect x="870" y="1012" width="28" height="28" rx="4" fill="#FFBD74" stroke="#8296A1" stroke-width="1"/><text x="910" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Amber work lights</text><rect x="1315" y="1012" width="28" height="28" rx="4" fill="#84D5D9" stroke="#8296A1" stroke-width="1"/><text x="1355" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Rare cyan signs</text><path d="M55 1060 H1745" fill="none" stroke="#455B68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="1098" fill="#FFBD74" font-size="16" font-weight="700">LANDMARK SEED</text><text x="255" y="1098" fill="#F4EEDD" font-size="20" font-weight="400">An offset pair of repair sheds with one broad amber roof band, framing an open two-exit yard.</text><text x="55" y="1190" fill="#FFBD74" font-size="16" font-weight="700">M1 RELATIONSHIP</text><text x="255" y="1190" fill="#F4EEDD" font-size="20" font-weight="400">Core identity: workshops, depot, service alley and chain yard. Keep a mixed-use housing pocket between quieter service</text><text x="255" y="1218" fill="#F4EEDD" font-size="20" font-weight="400">edges.</text><text x="55" y="1290" fill="#B5C7D0" font-size="17" font-weight="400">ALL NAMES ARE PLACEHOLDERS • Fixed blue-hour direction • Original 2D concept diagram, not game art</text></g></svg>