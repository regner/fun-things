<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320"><title>East Docks — approved district identity brief</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1800" height="1320" rx="0" fill="#102332" stroke="none" stroke-width="1"/><text x="55" y="46" fill="#B5C7D0" font-size="17" font-weight="600">BRACKETT / STAGE 03 / DISTRICT IDENTITY / APPROVED DIRECTION</text><text x="55" y="112" fill="#F4EEDD" font-size="48" font-weight="700">09  East Docks</text><text x="55" y="160" fill="#F5AE61" font-size="26" font-weight="400">The city ends at work</text><text x="55" y="201" fill="#B5C7D0" font-size="19" font-weight="400">Expansive / orderly / heavy</text><defs><clipPath id="motif"><rect width="750" height="620" rx="15"/></clipPath></defs><g transform="translate(55 240)" clip-path="url(#motif)"><rect x="0" y="0" width="750" height="620" rx="15" fill="#203644" stroke="none" stroke-width="1"/><rect x="550" y="0" width="200" height="620" rx="0" fill="#143E55" stroke="none" stroke-width="1"/><path d="M-20 350 H325 Q385 350 385 300 V-20" fill="none" stroke="#637383" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 350 H325 Q385 350 385 300 V-20" fill="none" stroke="#172D40" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 565 H435 Q485 565 485 515 V225" fill="none" stroke="#637383" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 565 H435 Q485 565 485 515 V225" fill="none" stroke="#172D40" stroke-width="33" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(0 172.5 105.5)"><rect x="47" y="64" width="265" height="101" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="40" y="55" width="265" height="101" rx="4" fill="#344D69" stroke="#8296A1" stroke-width="1.5"/><path d="M49 65 H296" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 105.5 H295" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 172.5 252.5)"><rect x="47" y="219" width="265" height="85" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="40" y="210" width="265" height="85" rx="4" fill="#344D69" stroke="#8296A1" stroke-width="1.5"/><path d="M49 220 H296" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 252.5 H295" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 197.5 472.0)"><rect x="77" y="444" width="255" height="74" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="70" y="435" width="255" height="74" rx="4" fill="#637580" stroke="#8296A1" stroke-width="1.5"/><path d="M79 445 H316" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 472.0 H315" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="526" y="70" width="70" height="180" rx="0" fill="#6C7E86" stroke="none" stroke-width="1"/><rect x="526" y="365" width="110" height="190" rx="0" fill="#6C7E86" stroke="none" stroke-width="1"/><path d="M509 182 V105 H636 M556 182 V105" fill="none" stroke="#F5AE61" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M533 105 L625 126" fill="none" stroke="#F5AE61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M539 488 V411 H666 M586 488 V411" fill="none" stroke="#F5AE61" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M563 411 L655 432" fill="none" stroke="#F5AE61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M435 60 V215 M425 415 V490" fill="none" stroke="#B8CDD0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 12"/></g><text x="75" y="890" fill="#F5AE61" font-size="16" font-weight="700">ROOF + OPEN-SPACE MOTIF</text><text x="75" y="926" fill="#F4EEDD" font-size="20" font-weight="400">01  Long warehouse roofs</text><text x="75" y="954" fill="#F4EEDD" font-size="20" font-weight="400">02  Broad loading apron</text><text x="75" y="982" fill="#F4EEDD" font-size="20" font-weight="400">03  Cranes / water edge</text><text x="75" y="1020" fill="#B5C7D0" font-size="17" font-weight="400">Schematic only: no scale, height or route validation.</text><text x="870" y="260" fill="#F5AE61" font-size="16" font-weight="700">PLAY</text><text x="870" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Longer warehouse runs, broad turning</text><text x="870" y="325" fill="#F4EEDD" font-size="20" font-weight="400">aprons and occasional car pockets. A</text><text x="870" y="352" fill="#F4EEDD" font-size="20" font-weight="400">spacious industrial contrast to</text><text x="870" y="379" fill="#F4EEDD" font-size="20" font-weight="400">Ironreach&#x27;s small repair courts.</text><text x="1315" y="260" fill="#F5AE61" font-size="16" font-weight="700">ARCHITECTURE</text><text x="1315" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Long warehouse roofs and substantial</text><text x="1315" y="325" fill="#F4EEDD" font-size="20" font-weight="400">loading yards form the largest</text><text x="1315" y="352" fill="#F4EEDD" font-size="20" font-weight="400">working blocks. Widely spaced cranes</text><text x="1315" y="379" fill="#F4EEDD" font-size="20" font-weight="400">and broad storage masses distinguish</text><text x="1315" y="406" fill="#F4EEDD" font-size="20" font-weight="400">them from small repair courts.</text><text x="870" y="510" fill="#F5AE61" font-size="16" font-weight="700">STREETS + ROUTES</text><text x="870" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Broad two-lane freight streets and</text><text x="870" y="575" fill="#F4EEDD" font-size="20" font-weight="400">generous turns serve long warehouse</text><text x="870" y="602" fill="#F4EEDD" font-size="20" font-weight="400">blocks and loading yards. Four lanes</text><text x="870" y="629" fill="#F4EEDD" font-size="20" font-weight="400">belong only on a justified approach,</text><text x="870" y="656" fill="#F4EEDD" font-size="20" font-weight="400">not every dock road.</text><text x="1315" y="510" fill="#F5AE61" font-size="16" font-weight="700">PROP FAMILIES</text><text x="1315" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Static cranes, bollards, loading</text><text x="1315" y="575" fill="#F4EEDD" font-size="20" font-weight="400">markers and sparse storage stacks.</text><text x="1315" y="602" fill="#F4EEDD" font-size="20" font-weight="400">No crane controls, ships or freight</text><text x="1315" y="629" fill="#F4EEDD" font-size="20" font-weight="400">simulation are implied.</text><text x="870" y="760" fill="#F5AE61" font-size="16" font-weight="700">LIGHT + ACCENT PLACEMENT</text><text x="870" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Amber crane and loading accents over</text><text x="870" y="825" fill="#F4EEDD" font-size="20" font-weight="400">cool blue roofs and water. Large</text><text x="870" y="852" fill="#F4EEDD" font-size="20" font-weight="400">quiet aprons separate bright working</text><text x="870" y="879" fill="#F4EEDD" font-size="20" font-weight="400">corners.</text><text x="1315" y="760" fill="#F5AE61" font-size="16" font-weight="700">SIGNAGE + HUMOUR</text><text x="1315" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Logistics with questionable</text><text x="1315" y="825" fill="#F4EEDD" font-size="20" font-weight="400">priorities. Sign idea: &#x27;Urgent</text><text x="1315" y="852" fill="#F4EEDD" font-size="20" font-weight="400">Eventually Freight&#x27;.</text><rect x="870" y="964" width="28" height="28" rx="4" fill="#344D69" stroke="#8296A1" stroke-width="1"/><text x="910" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Blue warehouses</text><rect x="1315" y="964" width="28" height="28" rx="4" fill="#637580" stroke="#8296A1" stroke-width="1"/><text x="1355" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Steel aprons</text><rect x="870" y="1012" width="28" height="28" rx="4" fill="#F5AE61" stroke="#8296A1" stroke-width="1"/><text x="910" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Amber cranes</text><rect x="1315" y="1012" width="28" height="28" rx="4" fill="#8ECED5" stroke="#8296A1" stroke-width="1"/><text x="1355" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Cool yard fill</text><path d="M55 1060 H1745" fill="none" stroke="#455B68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="1098" fill="#F5AE61" font-size="16" font-weight="700">LANDMARK SEED</text><text x="255" y="1098" fill="#F4EEDD" font-size="20" font-weight="400">Two unequal amber dock cranes at a stepped quay, separated by a generous open loading apron.</text><text x="55" y="1190" fill="#F5AE61" font-size="16" font-weight="700">M1 RELATIONSHIP</text><text x="255" y="1190" fill="#F4EEDD" font-size="20" font-weight="400">Whole-city reference only. M1 uses small workshops, not a full port or freight yard.</text><text x="55" y="1290" fill="#B5C7D0" font-size="17" font-weight="400">ALL NAMES ARE PLACEHOLDERS • Fixed blue-hour direction • Original 2D concept diagram, not game art</text></g></svg>