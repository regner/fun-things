<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320"><title>Broadlot — approved district identity brief</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1800" height="1320" rx="0" fill="#102332" stroke="none" stroke-width="1"/><text x="55" y="46" fill="#B5C7D0" font-size="17" font-weight="600">BRACKETT / STAGE 03 / DISTRICT IDENTITY / APPROVED DIRECTION</text><text x="55" y="112" fill="#F4EEDD" font-size="48" font-weight="700">07  Broadlot</text><text x="55" y="160" fill="#F69982" font-size="26" font-weight="400">Big roofs, bigger empty spaces</text><text x="55" y="201" fill="#B5C7D0" font-size="19" font-weight="400">Exposed / commercial / absurdly convenient</text><defs><clipPath id="motif"><rect width="750" height="620" rx="15"/></clipPath></defs><g transform="translate(55 240)" clip-path="url(#motif)"><rect x="0" y="0" width="750" height="620" rx="15" fill="#203644" stroke="none" stroke-width="1"/><path d="M-20 545 H575 Q685 545 685 430 V-20" fill="none" stroke="#637383" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 545 H575 Q685 545 685 430 V-20" fill="none" stroke="#172D40" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 95 H510 Q575 95 575 160 V200" fill="none" stroke="#637383" stroke-width="49" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 95 H510 Q575 95 575 160 V200" fill="none" stroke="#172D40" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(0 245.0 245.0)"><rect x="67" y="179" width="370" height="150" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="60" y="170" width="370" height="150" rx="4" fill="#374F68" stroke="#8296A1" stroke-width="1.5"/><path d="M69 180 H421" fill="none" stroke="#F69982" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 245.0 H420" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 421.5 290.0)"><rect x="372" y="269" width="113" height="60" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="365" y="260" width="113" height="60" rx="4" fill="#655C76" stroke="#8296A1" stroke-width="1.5"/><path d="M374 270 H469" fill="none" stroke="#BDE19A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M375 290.0 H468" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="72" y="352" width="383" height="144" rx="6" fill="#334855" stroke="none" stroke-width="1"/><path d="M80 360 V398 H109 V360" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M117 360 V398 H146 V360" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="123" y="366" width="17" height="28" rx="4" fill="#C6CECB" stroke="none" stroke-width="1"/><path d="M154 360 V398 H183 V360" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M191 360 V398 H220 V360" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M228 360 V398 H257 V360" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M265 360 V398 H294 V360" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="271" y="366" width="17" height="28" rx="4" fill="#C6CECB" stroke="none" stroke-width="1"/><path d="M302 360 V398 H331 V360" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M339 360 V398 H368 V360" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M376 360 V398 H405 V360" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M413 360 V398 H442 V360" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="419" y="366" width="17" height="28" rx="4" fill="#C6CECB" stroke="none" stroke-width="1"/><path d="M80 425 V463 H109 V425" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M117 425 V463 H146 V425" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M154 425 V463 H183 V425" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M191 425 V463 H220 V425" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="197" y="431" width="17" height="28" rx="4" fill="#C6CECB" stroke="none" stroke-width="1"/><path d="M228 425 V463 H257 V425" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M265 425 V463 H294 V425" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M302 425 V463 H331 V425" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M339 425 V463 H368 V425" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="345" y="431" width="17" height="28" rx="4" fill="#C6CECB" stroke="none" stroke-width="1"/><path d="M376 425 V463 H405 V425" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M413 425 V463 H442 V425" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(0 578.5 277.5)"><rect x="533" y="249" width="105" height="75" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="526" y="240" width="105" height="75" rx="4" fill="#655C76" stroke="#8296A1" stroke-width="1.5"/><path d="M535 250 H622" fill="none" stroke="#F69982" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M536 277.5 H621" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 590.0 417.5)"><rect x="559" y="372" width="76" height="109" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="552" y="363" width="76" height="109" rx="4" fill="#374F68" stroke="#8296A1" stroke-width="1.5"/><path d="M561 373 H619" fill="none" stroke="#BDE19A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M562 417.5 H618" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="500" cy="145" r="24" fill="#697D76" stroke="#BDE19A" stroke-width="3"/></g><text x="75" y="890" fill="#F69982" font-size="16" font-weight="700">ROOF + OPEN-SPACE MOTIF</text><text x="75" y="926" fill="#F4EEDD" font-size="20" font-weight="400">01  Large retail roof</text><text x="75" y="954" fill="#F4EEDD" font-size="20" font-weight="400">02  Open parking field</text><text x="75" y="982" fill="#F4EEDD" font-size="20" font-weight="400">03  Separate shop pads</text><text x="75" y="1020" fill="#B5C7D0" font-size="17" font-weight="400">Schematic only: no scale, height or route validation.</text><text x="870" y="260" fill="#F69982" font-size="16" font-weight="700">PLAY</text><text x="870" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Open driving space, readable vehicle</text><text x="870" y="325" fill="#F4EEDD" font-size="20" font-weight="400">clusters and long lines of sight.</text><text x="870" y="352" fill="#F4EEDD" font-size="20" font-weight="400">Sparse occupied bays leave room to</text><text x="870" y="379" fill="#F4EEDD" font-size="20" font-weight="400">turn, flee and recover.</text><text x="1315" y="260" fill="#F69982" font-size="16" font-weight="700">ARCHITECTURE</text><text x="1315" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Large irregular retail/parking sites</text><text x="1315" y="325" fill="#F4EEDD" font-size="20" font-weight="400">dominate, with separate small shop</text><text x="1315" y="352" fill="#F4EEDD" font-size="20" font-weight="400">plots around them. Giant low roofs</text><text x="1315" y="379" fill="#F4EEDD" font-size="20" font-weight="400">and open asphalt contrast with the</text><text x="1315" y="406" fill="#F4EEDD" font-size="20" font-weight="400">fine-grained residential streets.</text><text x="870" y="510" fill="#F69982" font-size="16" font-weight="700">STREETS + ROUTES</text><text x="870" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Four-lane approaches where useful</text><text x="870" y="575" fill="#F4EEDD" font-size="20" font-weight="400">lead to two-lane site access and</text><text x="870" y="602" fill="#F4EEDD" font-size="20" font-weight="400">parking aisles. Large retail/parking</text><text x="870" y="629" fill="#F4EEDD" font-size="20" font-weight="400">sites coexist with small shop plots;</text><text x="870" y="656" fill="#F4EEDD" font-size="20" font-weight="400">road size follows demand.</text><text x="1315" y="510" fill="#F69982" font-size="16" font-weight="700">PROP FAMILIES</text><text x="1315" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Trolley shelters, low signs, light</text><text x="1315" y="575" fill="#F4EEDD" font-size="20" font-weight="400">poles and sparse planted islands.</text><text x="1315" y="602" fill="#F4EEDD" font-size="20" font-weight="400">Keep wide views across the parking</text><text x="1315" y="629" fill="#F4EEDD" font-size="20" font-weight="400">rows.</text><text x="870" y="760" fill="#F69982" font-size="16" font-weight="700">LIGHT + ACCENT PLACEMENT</text><text x="870" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Cool roofs, coral entrance bands and</text><text x="870" y="825" fill="#F4EEDD" font-size="20" font-weight="400">a few lime wayfinding anchors. Broad</text><text x="870" y="852" fill="#F4EEDD" font-size="20" font-weight="400">neutral light keeps cars distinct</text><text x="870" y="879" fill="#F4EEDD" font-size="20" font-weight="400">from the ground.</text><text x="1315" y="760" fill="#F69982" font-size="16" font-weight="700">SIGNAGE + HUMOUR</text><text x="1315" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Buying more than anyone needs. Sign</text><text x="1315" y="825" fill="#F4EEDD" font-size="20" font-weight="400">idea: &#x27;Everything You Nearly</text><text x="1315" y="852" fill="#F4EEDD" font-size="20" font-weight="400">Needed&#x27;.</text><rect x="870" y="964" width="28" height="28" rx="4" fill="#374F68" stroke="#8296A1" stroke-width="1"/><text x="910" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Blue box roofs</text><rect x="1315" y="964" width="28" height="28" rx="4" fill="#655C76" stroke="#8296A1" stroke-width="1"/><text x="1355" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Muted plum</text><rect x="870" y="1012" width="28" height="28" rx="4" fill="#F69982" stroke="#8296A1" stroke-width="1"/><text x="910" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Coral entrances</text><rect x="1315" y="1012" width="28" height="28" rx="4" fill="#BDE19A" stroke="#8296A1" stroke-width="1"/><text x="1355" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Lime wayfinding</text><path d="M55 1060 H1745" fill="none" stroke="#455B68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="1098" fill="#F69982" font-size="16" font-weight="700">LANDMARK SEED</text><text x="255" y="1098" fill="#F4EEDD" font-size="20" font-weight="400">One giant stepped retail roof and a detached circular sign island, separated by an unusually broad forecourt.</text><text x="55" y="1190" fill="#F69982" font-size="16" font-weight="700">M1 RELATIONSHIP</text><text x="255" y="1190" fill="#F4EEDD" font-size="20" font-weight="400">A compact parking/service edge feeds the chain yard. No full retail superblock is required inside M1.</text><text x="55" y="1290" fill="#B5C7D0" font-size="17" font-weight="400">ALL NAMES ARE PLACEHOLDERS • Fixed blue-hour direction • Original 2D concept diagram, not game art</text></g></svg>