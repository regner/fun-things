<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320"><title>Glassward — approved district identity brief</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1800" height="1320" rx="0" fill="#102332" stroke="none" stroke-width="1"/><text x="55" y="46" fill="#B5C7D0" font-size="17" font-weight="600">BRACKETT / STAGE 03 / DISTRICT IDENTITY / APPROVED DIRECTION</text><text x="55" y="112" fill="#F4EEDD" font-size="48" font-weight="700">04  Glassward</text><text x="55" y="160" fill="#67DFEA" font-size="26" font-weight="400">The skyline presses in</text><text x="55" y="201" fill="#B5C7D0" font-size="19" font-weight="400">Cool / imposing / self-important</text><defs><clipPath id="motif"><rect width="750" height="620" rx="15"/></clipPath></defs><g transform="translate(55 240)" clip-path="url(#motif)"><rect x="0" y="0" width="750" height="620" rx="15" fill="#203644" stroke="none" stroke-width="1"/><path d="M-20 340 H780" fill="none" stroke="#637383" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 340 H780" fill="none" stroke="#172D40" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 -20 V650" fill="none" stroke="#637383" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 -20 V650" fill="none" stroke="#172D40" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 -20 V650" fill="none" stroke="#637383" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 -20 V650" fill="none" stroke="#172D40" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 600 H780" fill="none" stroke="#637383" stroke-width="49" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 600 H780" fill="none" stroke="#172D40" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(0 122.5 152.5)"><rect x="62" y="74" width="135" height="175" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="55" y="65" width="135" height="175" rx="4" fill="#455879" stroke="#8296A1" stroke-width="1.5"/><path d="M64 75 H181" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 152.5 H180" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 121.5 153.0)"><rect x="87" y="97" width="83" height="130" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="80" y="88" width="83" height="130" rx="4" fill="#26375B" stroke="#8296A1" stroke-width="1.5"/><path d="M89 98 H154" fill="none" stroke="#67DFEA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 153.0 H153" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="91" y="101" width="61" height="103" rx="5" fill="#1A2B4B" stroke="none" stroke-width="1"/><g transform="rotate(0 447.5 140.0)"><rect x="377" y="74" width="155" height="150" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="370" y="65" width="155" height="150" rx="4" fill="#455879" stroke="#8296A1" stroke-width="1.5"/><path d="M379 75 H516" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M380 140.0 H515" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 446.5 140.5)"><rect x="402" y="97" width="103" height="105" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="395" y="88" width="103" height="105" rx="4" fill="#26375B" stroke="#8296A1" stroke-width="1.5"/><path d="M404 98 H489" fill="none" stroke="#67DFEA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M405 140.5 H488" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="406" y="101" width="81" height="78" rx="5" fill="#1A2B4B" stroke="none" stroke-width="1"/><g transform="rotate(0 510.0 495.0)"><rect x="447" y="434" width="140" height="140" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="440" y="425" width="140" height="140" rx="4" fill="#455879" stroke="#8296A1" stroke-width="1.5"/><path d="M449 435 H571" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 495.0 H570" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 509.0 495.5)"><rect x="472" y="457" width="88" height="95" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="465" y="448" width="88" height="95" rx="4" fill="#26375B" stroke="#8296A1" stroke-width="1.5"/><path d="M474 458 H544" fill="none" stroke="#67DFEA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M475 495.5 H543" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="476" y="461" width="66" height="68" rx="5" fill="#1A2B4B" stroke="none" stroke-width="1"/><circle cx="565" cy="255" r="43" fill="#455879" stroke="#8296A1" stroke-width="2"/><circle cx="565" cy="255" r="29" fill="#26375B" stroke="#DE7EC8" stroke-width="5"/><rect x="60" y="535" width="170" height="50" rx="4" fill="#455879" stroke="none" stroke-width="1"/><rect x="335" y="393" width="70" height="110" rx="4" fill="#B7CAD1" stroke="none" stroke-width="1"/></g><text x="75" y="890" fill="#67DFEA" font-size="16" font-weight="700">ROOF + OPEN-SPACE MOTIF</text><text x="75" y="926" fill="#F4EEDD" font-size="20" font-weight="400">01  Unequal crowns</text><text x="75" y="954" fill="#F4EEDD" font-size="20" font-weight="400">02  Open forecourt</text><text x="75" y="982" fill="#F4EEDD" font-size="20" font-weight="400">03  Low podium gaps</text><text x="75" y="1020" fill="#B5C7D0" font-size="17" font-weight="400">Schematic only: no scale, height or route validation.</text><text x="870" y="260" fill="#67DFEA" font-size="16" font-weight="700">PLAY</text><text x="870" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Longer straight driving runs and</text><text x="870" y="325" fill="#F4EEDD" font-size="20" font-weight="400">regular junctions create a distinct</text><text x="870" y="352" fill="#F4EEDD" font-size="20" font-weight="400">downtown rhythm. Setback forecourts</text><text x="870" y="379" fill="#F4EEDD" font-size="20" font-weight="400">offer breathing room near busy</text><text x="870" y="406" fill="#F4EEDD" font-size="20" font-weight="400">office corners.</text><text x="1315" y="260" fill="#67DFEA" font-size="16" font-weight="700">ARCHITECTURE</text><text x="1315" y="298" fill="#F4EEDD" font-size="20" font-weight="400">A substantial tower district with</text><text x="1315" y="325" fill="#F4EEDD" font-size="20" font-weight="400">unequal tower/podium sites and open</text><text x="1315" y="352" fill="#F4EEDD" font-size="20" font-weight="400">forecourts. Rectangular, chamfered</text><text x="1315" y="379" fill="#F4EEDD" font-size="20" font-weight="400">and rounded crowns vary; a tower</text><text x="1315" y="406" fill="#F4EEDD" font-size="20" font-weight="400">need not occupy an entire block.</text><text x="870" y="510" fill="#67DFEA" font-size="16" font-weight="700">STREETS + ROUTES</text><text x="870" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Straight avenues and right-angle</text><text x="870" y="575" fill="#F4EEDD" font-size="20" font-weight="400">cross streets form a downtown grid</text><text x="870" y="602" fill="#F4EEDD" font-size="20" font-weight="400">with unequal blocks. Smaller service</text><text x="870" y="629" fill="#F4EEDD" font-size="20" font-weight="400">links reach tower sites; curved edge</text><text x="870" y="656" fill="#F4EEDD" font-size="20" font-weight="400">connections lead into other</text><text x="870" y="683" fill="#F4EEDD" font-size="20" font-weight="400">districts.</text><text x="1315" y="510" fill="#67DFEA" font-size="16" font-weight="700">PROP FAMILIES</text><text x="1315" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Large restrained signs, low</text><text x="1315" y="575" fill="#F4EEDD" font-size="20" font-weight="400">planters, forecourt lights and</text><text x="1315" y="602" fill="#F4EEDD" font-size="20" font-weight="400">grouped street furniture. Roof</text><text x="1315" y="629" fill="#F4EEDD" font-size="20" font-weight="400">equipment stays broad and sparse.</text><text x="870" y="760" fill="#67DFEA" font-size="16" font-weight="700">LIGHT + ACCENT PLACEMENT</text><text x="870" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Cyan crowns over indigo masses, with</text><text x="870" y="825" fill="#F4EEDD" font-size="20" font-weight="400">a few magenta corporate accents.</text><text x="870" y="852" fill="#F4EEDD" font-size="20" font-weight="400">Pale ground fill must keep actors</text><text x="870" y="879" fill="#F4EEDD" font-size="20" font-weight="400">readable beside towers.</text><text x="1315" y="760" fill="#67DFEA" font-size="16" font-weight="700">SIGNAGE + HUMOUR</text><text x="1315" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Prestige with nothing behind it.</text><text x="1315" y="825" fill="#F4EEDD" font-size="20" font-weight="400">Sign idea: &#x27;Tomorrow Has Been</text><text x="1315" y="852" fill="#F4EEDD" font-size="20" font-weight="400">Rescheduled&#x27;.</text><rect x="870" y="964" width="28" height="28" rx="4" fill="#26375B" stroke="#8296A1" stroke-width="1"/><text x="910" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Indigo towers</text><rect x="1315" y="964" width="28" height="28" rx="4" fill="#455879" stroke="#8296A1" stroke-width="1"/><text x="1355" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Slate podiums</text><rect x="870" y="1012" width="28" height="28" rx="4" fill="#67DFEA" stroke="#8296A1" stroke-width="1"/><text x="910" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Cyan crowns</text><rect x="1315" y="1012" width="28" height="28" rx="4" fill="#DE7EC8" stroke="#8296A1" stroke-width="1"/><text x="1355" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Rare magenta</text><path d="M55 1060 H1745" fill="none" stroke="#455B68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="1098" fill="#67DFEA" font-size="16" font-weight="700">LANDMARK SEED</text><text x="255" y="1098" fill="#F4EEDD" font-size="20" font-weight="400">Three unequal tower crowns around an open forecourt; the empty space is as recognisable as the skyline.</text><text x="55" y="1190" fill="#67DFEA" font-size="16" font-weight="700">M1 RELATIONSHIP</text><text x="255" y="1190" fill="#F4EEDD" font-size="20" font-weight="400">A carefully placed tower edge supplies downtown exposure; the full skyline remains outside the slice.</text><text x="55" y="1290" fill="#B5C7D0" font-size="17" font-weight="400">ALL NAMES ARE PLACEHOLDERS • Fixed blue-hour direction • Original 2D concept diagram, not game art</text></g></svg>