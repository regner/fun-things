<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320"><title>Glassward — approved district identity brief</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1800" height="1320" rx="0" fill="#102332" stroke="none" stroke-width="1"/><text x="55" y="46" fill="#B5C7D0" font-size="17" font-weight="600">BRACKETT / STAGE 03 / DISTRICT IDENTITY / APPROVED DIRECTION</text><text x="55" y="112" fill="#F4EEDD" font-size="48" font-weight="700">04  Glassward</text><text x="55" y="160" fill="#67DFEA" font-size="26" font-weight="400">The skyline presses in</text><text x="55" y="201" fill="#B5C7D0" font-size="19" font-weight="400">Cool / imposing / self-important</text><defs><clipPath id="motif"><rect width="750" height="620" rx="15"/></clipPath></defs><g transform="translate(55 240)" clip-path="url(#motif)"><rect x="0" y="0" width="750" height="620" rx="15" fill="#203644" stroke="none" stroke-width="1"/><path d="M-20 475 H260 Q360 475 420 420 L505 335 Q550 295 780 295" fill="none" stroke="#637383" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 475 H260 Q360 475 420 420 L505 335 Q550 295 780 295" fill="none" stroke="#172D40" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/><path d="M275 -20 V155 Q275 230 320 280 L400 435" fill="none" stroke="#637383" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/><path d="M275 -20 V155 Q275 230 320 280 L400 435" fill="none" stroke="#172D40" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(0 126.5 162.0)"><rect x="62" y="79" width="143" height="184" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="55" y="70" width="143" height="184" rx="4" fill="#455879" stroke="#8296A1" stroke-width="1.5"/><path d="M64 80 H189" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 162.0 H188" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 125.5 162.5)"><rect x="87" y="102" width="91" height="139" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="80" y="93" width="91" height="139" rx="4" fill="#26375B" stroke="#8296A1" stroke-width="1.5"/><path d="M89 103 H162" fill="none" stroke="#67DFEA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 162.5 H161" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="91" y="106" width="69" height="112" rx="5" fill="#1A2B4B" stroke="none" stroke-width="1"/><g transform="rotate(0 479.0 136.0)"><rect x="399" y="65" width="174" height="160" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="392" y="56" width="174" height="160" rx="4" fill="#455879" stroke="#8296A1" stroke-width="1.5"/><path d="M401 66 H557" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M402 136.0 H556" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 478.0 136.5)"><rect x="424" y="88" width="122" height="115" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="417" y="79" width="122" height="115" rx="4" fill="#26375B" stroke="#8296A1" stroke-width="1.5"/><path d="M426 89 H530" fill="none" stroke="#67DFEA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M427 136.5 H529" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="428" y="92" width="100" height="88" rx="5" fill="#1A2B4B" stroke="none" stroke-width="1"/><g transform="rotate(0 622.0 476.5)"><rect x="552" y="407" width="154" height="157" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="545" y="398" width="154" height="157" rx="4" fill="#455879" stroke="#8296A1" stroke-width="1.5"/><path d="M554 408 H690" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M555 476.5 H689" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 621.0 477.0)"><rect x="577" y="430" width="102" height="112" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="570" y="421" width="102" height="112" rx="4" fill="#26375B" stroke="#8296A1" stroke-width="1.5"/><path d="M579 431 H663" fill="none" stroke="#67DFEA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M580 477.0 H662" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="581" y="434" width="80" height="85" rx="5" fill="#1A2B4B" stroke="none" stroke-width="1"/><circle cx="435" cy="263" r="58" fill="#455879" stroke="#8296A1" stroke-width="2"/><circle cx="435" cy="263" r="39" fill="#26375B" stroke="#DE7EC8" stroke-width="5"/><rect x="60" y="535" width="170" height="50" rx="4" fill="#455879" stroke="none" stroke-width="1"/><path d="M365 388 L433 347" fill="none" stroke="#B7CAD1" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g><text x="75" y="890" fill="#67DFEA" font-size="16" font-weight="700">ROOF + OPEN-SPACE MOTIF</text><text x="75" y="926" fill="#F4EEDD" font-size="20" font-weight="400">01  Unequal crowns</text><text x="75" y="954" fill="#F4EEDD" font-size="20" font-weight="400">02  Open forecourt</text><text x="75" y="982" fill="#F4EEDD" font-size="20" font-weight="400">03  Low podium gaps</text><text x="75" y="1020" fill="#B5C7D0" font-size="17" font-weight="400">Schematic only: no scale, height or route validation.</text><text x="870" y="260" fill="#67DFEA" font-size="16" font-weight="700">PLAY</text><text x="870" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Longer driving runs broken by bends</text><text x="870" y="325" fill="#F4EEDD" font-size="20" font-weight="400">and offset junctions. Setback</text><text x="870" y="352" fill="#F4EEDD" font-size="20" font-weight="400">forecourts offer breathing room near</text><text x="870" y="379" fill="#F4EEDD" font-size="20" font-weight="400">busy office corners.</text><text x="1315" y="260" fill="#67DFEA" font-size="16" font-weight="700">ARCHITECTURE</text><text x="1315" y="298" fill="#F4EEDD" font-size="20" font-weight="400">A substantial tower district with</text><text x="1315" y="325" fill="#F4EEDD" font-size="20" font-weight="400">unequal tower/podium sites and open</text><text x="1315" y="352" fill="#F4EEDD" font-size="20" font-weight="400">forecourts. Rectangular, chamfered</text><text x="1315" y="379" fill="#F4EEDD" font-size="20" font-weight="400">and rounded crowns vary; a tower</text><text x="1315" y="406" fill="#F4EEDD" font-size="20" font-weight="400">need not occupy an entire block.</text><text x="870" y="510" fill="#67DFEA" font-size="16" font-weight="700">STREETS + ROUTES</text><text x="870" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Selected four-lane avenues connect</text><text x="870" y="575" fill="#F4EEDD" font-size="20" font-weight="400">the larger downtown; two-lane cross</text><text x="870" y="602" fill="#F4EEDD" font-size="20" font-weight="400">streets and small service links</text><text x="870" y="629" fill="#F4EEDD" font-size="20" font-weight="400">divide unequal podium sites. Tower</text><text x="870" y="656" fill="#F4EEDD" font-size="20" font-weight="400">setbacks protect routes.</text><text x="1315" y="510" fill="#67DFEA" font-size="16" font-weight="700">PROP FAMILIES</text><text x="1315" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Large restrained signs, low</text><text x="1315" y="575" fill="#F4EEDD" font-size="20" font-weight="400">planters, forecourt lights and</text><text x="1315" y="602" fill="#F4EEDD" font-size="20" font-weight="400">grouped street furniture. Roof</text><text x="1315" y="629" fill="#F4EEDD" font-size="20" font-weight="400">equipment stays broad and sparse.</text><text x="870" y="760" fill="#67DFEA" font-size="16" font-weight="700">LIGHT + ACCENT PLACEMENT</text><text x="870" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Cyan crowns over indigo masses, with</text><text x="870" y="825" fill="#F4EEDD" font-size="20" font-weight="400">a few magenta corporate accents.</text><text x="870" y="852" fill="#F4EEDD" font-size="20" font-weight="400">Pale ground fill must keep actors</text><text x="870" y="879" fill="#F4EEDD" font-size="20" font-weight="400">readable beside towers.</text><text x="1315" y="760" fill="#67DFEA" font-size="16" font-weight="700">SIGNAGE + HUMOUR</text><text x="1315" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Prestige with nothing behind it.</text><text x="1315" y="825" fill="#F4EEDD" font-size="20" font-weight="400">Sign idea: &#x27;Tomorrow Has Been</text><text x="1315" y="852" fill="#F4EEDD" font-size="20" font-weight="400">Rescheduled&#x27;.</text><rect x="870" y="964" width="28" height="28" rx="4" fill="#26375B" stroke="#8296A1" stroke-width="1"/><text x="910" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Indigo towers</text><rect x="1315" y="964" width="28" height="28" rx="4" fill="#455879" stroke="#8296A1" stroke-width="1"/><text x="1355" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Slate podiums</text><rect x="870" y="1012" width="28" height="28" rx="4" fill="#67DFEA" stroke="#8296A1" stroke-width="1"/><text x="910" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Cyan crowns</text><rect x="1315" y="1012" width="28" height="28" rx="4" fill="#DE7EC8" stroke="#8296A1" stroke-width="1"/><text x="1355" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Rare magenta</text><path d="M55 1060 H1745" fill="none" stroke="#455B68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="1098" fill="#67DFEA" font-size="16" font-weight="700">LANDMARK SEED</text><text x="255" y="1098" fill="#F4EEDD" font-size="20" font-weight="400">Three unequal tower crowns around an open forecourt; the empty space is as recognisable as the skyline.</text><text x="55" y="1190" fill="#67DFEA" font-size="16" font-weight="700">M1 RELATIONSHIP</text><text x="255" y="1190" fill="#F4EEDD" font-size="20" font-weight="400">A carefully placed tower edge supplies downtown exposure; the full skyline remains outside the slice.</text><text x="55" y="1290" fill="#B5C7D0" font-size="17" font-weight="400">ALL NAMES ARE PLACEHOLDERS • Fixed blue-hour direction • Original 2D concept diagram, not game art</text></g></svg>