<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320"><title>Northpoint — approved district identity brief</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1800" height="1320" rx="0" fill="#102332" stroke="none" stroke-width="1"/><text x="55" y="46" fill="#B5C7D0" font-size="17" font-weight="600">BRACKETT / STAGE 03 / DISTRICT IDENTITY / APPROVED DIRECTION</text><text x="55" y="112" fill="#F4EEDD" font-size="48" font-weight="700">01  Northpoint</text><text x="55" y="160" fill="#BCE5CB" font-size="26" font-weight="400">The city&#x27;s breathing space</text><text x="55" y="201" fill="#B5C7D0" font-size="19" font-weight="400">Spacious / earnest / quietly eccentric</text><defs><clipPath id="motif"><rect width="750" height="620" rx="15"/></clipPath></defs><g transform="translate(55 240)" clip-path="url(#motif)"><rect x="0" y="0" width="750" height="620" rx="15" fill="#203644" stroke="none" stroke-width="1"/><path d="M-20 550 C60 610 120 580 120 440 V170 Q120 75 225 75 H610 Q680 75 680 180 V650" fill="none" stroke="#637383" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 550 C60 610 120 580 120 440 V170 Q120 75 225 75 H610 Q680 75 680 180 V650" fill="none" stroke="#172D40" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/><rect x="205" y="185" width="210" height="225" rx="6" fill="#385D58" stroke="none" stroke-width="1"/><g transform="rotate(0 315.0 170.0)"><rect x="197" y="159" width="250" height="40" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="190" y="150" width="250" height="40" rx="4" fill="#284B56" stroke="#8296A1" stroke-width="1.5"/><path d="M199 160 H431" fill="none" stroke="#FFC580" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 170.0 H430" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 210.0 317.5)"><rect x="192" y="209" width="50" height="235" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="185" y="200" width="50" height="235" rx="4" fill="#284B56" stroke="#8296A1" stroke-width="1.5"/><path d="M194 210 H226" fill="none" stroke="#FFC580" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 317.5 H225" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 347.5 437.5)"><rect x="272" y="424" width="165" height="45" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="265" y="415" width="165" height="45" rx="4" fill="#284B56" stroke="#8296A1" stroke-width="1.5"/><path d="M274 425 H421" fill="none" stroke="#FFC580" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M275 437.5 H420" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="480" y="205" width="155" height="255" rx="65" fill="#487566" stroke="#FFC580" stroke-width="3"/><rect x="503" y="235" width="109" height="195" rx="45" fill="#355F55" stroke="#ABCABD" stroke-width="2"/><path d="M505 331 H610" fill="none" stroke="#ABCABD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(0 552.5 514.0)"><rect x="492" y="496" width="135" height="54" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="485" y="487" width="135" height="54" rx="4" fill="#44786F" stroke="#8296A1" stroke-width="1.5"/><path d="M494 497 H611" fill="none" stroke="#BCE5CB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M495 514.0 H610" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M260 290 H405 M340 200 V400" fill="none" stroke="#A4B6AC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="75" y="890" fill="#BCE5CB" font-size="16" font-weight="700">ROOF + OPEN-SPACE MOTIF</text><text x="75" y="926" fill="#F4EEDD" font-size="20" font-weight="400">01  Open quadrangle</text><text x="75" y="954" fill="#F4EEDD" font-size="20" font-weight="400">02  Sports field</text><text x="75" y="982" fill="#F4EEDD" font-size="20" font-weight="400">03  Perimeter drive</text><text x="75" y="1020" fill="#B5C7D0" font-size="17" font-weight="400">Schematic only: no scale, height or route validation.</text><text x="870" y="260" fill="#BCE5CB" font-size="16" font-weight="700">PLAY</text><text x="870" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Longer perimeter drives, open</text><text x="870" y="325" fill="#F4EEDD" font-size="20" font-weight="400">pedestrian courts and sparse parked-</text><text x="870" y="352" fill="#F4EEDD" font-size="20" font-weight="400">car pockets. A quieter counterpoint</text><text x="870" y="379" fill="#F4EEDD" font-size="20" font-weight="400">to the commercial centre.</text><text x="1315" y="260" fill="#BCE5CB" font-size="16" font-weight="700">ARCHITECTURE</text><text x="1315" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Large sports and campus plots</text><text x="1315" y="325" fill="#F4EEDD" font-size="20" font-weight="400">contain smaller courts and low</text><text x="1315" y="352" fill="#F4EEDD" font-size="20" font-weight="400">academic wings. Broad field</text><text x="1315" y="379" fill="#F4EEDD" font-size="20" font-weight="400">rectangles contrast with varied</text><text x="1315" y="406" fill="#F4EEDD" font-size="20" font-weight="400">building footprints; the district</text><text x="1315" y="433" fill="#F4EEDD" font-size="20" font-weight="400">has no equal-area quota.</text><text x="870" y="510" fill="#BCE5CB" font-size="16" font-weight="700">STREETS + ROUTES</text><text x="870" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Two-lane perimeter streets serve</text><text x="870" y="575" fill="#F4EEDD" font-size="20" font-weight="400">large campus grounds. Narrower</text><text x="870" y="602" fill="#F4EEDD" font-size="20" font-weight="400">service access and walking paths</text><text x="870" y="629" fill="#F4EEDD" font-size="20" font-weight="400">reach smaller courts without cutting</text><text x="870" y="656" fill="#F4EEDD" font-size="20" font-weight="400">the fields into standard blocks.</text><text x="1315" y="510" fill="#BCE5CB" font-size="16" font-weight="700">PROP FAMILIES</text><text x="1315" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Low benches, cycle stands, field</text><text x="1315" y="575" fill="#F4EEDD" font-size="20" font-weight="400">lights and oversized campus maps.</text><text x="1315" y="602" fill="#F4EEDD" font-size="20" font-weight="400">Keep trees in small groups away from</text><text x="1315" y="629" fill="#F4EEDD" font-size="20" font-weight="400">movement corridors.</text><text x="870" y="760" fill="#BCE5CB" font-size="16" font-weight="700">LIGHT + ACCENT PLACEMENT</text><text x="870" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Cool, softly filled courts. Mint at</text><text x="870" y="825" fill="#F4EEDD" font-size="20" font-weight="400">entrances and route markers; amber</text><text x="870" y="852" fill="#F4EEDD" font-size="20" font-weight="400">at occupied doors. Most roofs remain</text><text x="870" y="879" fill="#F4EEDD" font-size="20" font-weight="400">quiet.</text><text x="1315" y="760" fill="#BCE5CB" font-size="16" font-weight="700">SIGNAGE + HUMOUR</text><text x="1315" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Academic certainty about trivial</text><text x="1315" y="825" fill="#F4EEDD" font-size="20" font-weight="400">things. Sign idea: &#x27;Institute of</text><text x="1315" y="852" fill="#F4EEDD" font-size="20" font-weight="400">Almost Knowing&#x27;.</text><rect x="870" y="964" width="28" height="28" rx="4" fill="#284B56" stroke="#8296A1" stroke-width="1"/><text x="910" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Slate roofs</text><rect x="1315" y="964" width="28" height="28" rx="4" fill="#44786F" stroke="#8296A1" stroke-width="1"/><text x="1355" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Field green</text><rect x="870" y="1012" width="28" height="28" rx="4" fill="#BCE5CB" stroke="#8296A1" stroke-width="1"/><text x="910" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Mint wayfinding</text><rect x="1315" y="1012" width="28" height="28" rx="4" fill="#FFC580" stroke="#8296A1" stroke-width="1"/><text x="1355" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Warm entries</text><path d="M55 1060 H1745" fill="none" stroke="#455B68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="1098" fill="#BCE5CB" font-size="16" font-weight="700">LANDMARK SEED</text><text x="255" y="1098" fill="#F4EEDD" font-size="20" font-weight="400">A crescent-shaped sports pavilion beside a simple oval track; legible by its roof and field, without a giant tower.</text><text x="55" y="1190" fill="#BCE5CB" font-size="16" font-weight="700">M1 RELATIONSHIP</text><text x="255" y="1190" fill="#F4EEDD" font-size="20" font-weight="400">Whole-city reference only. No campus block is required in M1.</text><text x="55" y="1290" fill="#B5C7D0" font-size="17" font-weight="400">ALL NAMES ARE PLACEHOLDERS • Fixed blue-hour direction • Original 2D concept diagram, not game art</text></g></svg>