<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320"><title>Signal Row — approved district identity brief</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1800" height="1320" rx="0" fill="#102332" stroke="none" stroke-width="1"/><text x="55" y="46" fill="#B5C7D0" font-size="17" font-weight="600">BRACKETT / STAGE 03 / DISTRICT IDENTITY / APPROVED DIRECTION</text><text x="55" y="112" fill="#F4EEDD" font-size="48" font-weight="700">06  Signal Row</text><text x="55" y="160" fill="#ED73BC" font-size="26" font-weight="400">The city&#x27;s bright social centre</text><text x="55" y="201" fill="#B5C7D0" font-size="19" font-weight="400">Electric / crowded / cheeky</text><defs><clipPath id="motif"><rect width="750" height="620" rx="15"/></clipPath></defs><g transform="translate(55 240)" clip-path="url(#motif)"><rect x="0" y="0" width="750" height="620" rx="15" fill="#203644" stroke="none" stroke-width="1"/><path d="M-20 265 H210 Q280 265 330 325 L460 450 H785" fill="none" stroke="#637383" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 265 H210 Q280 265 330 325 L460 450 H785" fill="none" stroke="#172D40" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 -20 V90 Q215 135 260 150 H555 Q625 150 625 240 V450" fill="none" stroke="#637383" stroke-width="51" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 -20 V90 Q215 135 260 150 H555 Q625 150 625 240 V450" fill="none" stroke="#172D40" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><rect x="435" y="295" width="140" height="80" rx="8" fill="#637486" stroke="none" stroke-width="1"/><circle cx="455" cy="218" r="78" fill="#63566C" stroke="#97B4BC" stroke-width="2"/><circle cx="455" cy="218" r="56" fill="#383E62" stroke="#ED73BC" stroke-width="7"/><circle cx="455" cy="218" r="29" fill="#253850" stroke="#74E0E7" stroke-width="3"/><g transform="rotate(0 107.5 143.5)"><rect x="52" y="109" width="125" height="87" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="45" y="100" width="125" height="87" rx="4" fill="#383E62" stroke="#8296A1" stroke-width="1.5"/><path d="M54 110 H161" fill="none" stroke="#74E0E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 143.5 H160" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 86.5 397.0)"><rect x="57" y="349" width="73" height="114" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="50" y="340" width="73" height="114" rx="4" fill="#63566C" stroke="#8296A1" stroke-width="1.5"/><path d="M59 350 H114" fill="none" stroke="#ED73BC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 397.0 H113" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 193.0 403.0)"><rect x="164" y="367" width="72" height="90" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="157" y="358" width="72" height="90" rx="4" fill="#383E62" stroke="#8296A1" stroke-width="1.5"/><path d="M166 368 H220" fill="none" stroke="#74E0E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M167 403.0 H219" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 143.0 528.5)"><rect x="72" y="509" width="156" height="57" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="65" y="500" width="156" height="57" rx="4" fill="#63566C" stroke="#8296A1" stroke-width="1.5"/><path d="M74 510 H212" fill="none" stroke="#ED73BC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M75 528.5 H211" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 352.5 82.5)"><rect x="307" y="64" width="105" height="55" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="300" y="55" width="105" height="55" rx="4" fill="#383E62" stroke="#8296A1" stroke-width="1.5"/><path d="M309 65 H396" fill="none" stroke="#74E0E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M310 82.5 H395" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 489.5 80.0)"><rect x="444" y="64" width="105" height="50" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="437" y="55" width="105" height="50" rx="4" fill="#63566C" stroke="#8296A1" stroke-width="1.5"/><path d="M446 65 H533" fill="none" stroke="#ED73BC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M447 80.0 H532" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 605.5 554.5)"><rect x="552" y="533" width="121" height="61" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="545" y="524" width="121" height="61" rx="4" fill="#383E62" stroke="#8296A1" stroke-width="1.5"/><path d="M554 534 H657" fill="none" stroke="#74E0E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M555 554.5 H656" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M140 339 V491" fill="none" stroke="#D0CDD0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 10"/><rect x="312" y="501" width="161" height="72" rx="6" fill="#334855" stroke="none" stroke-width="1"/><path d="M320 509 V547 H349 V509" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M357 509 V547 H386 V509" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="363" y="515" width="17" height="28" rx="4" fill="#C6CECB" stroke="none" stroke-width="1"/><path d="M394 509 V547 H423 V509" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M431 509 V547 H460 V509" fill="none" stroke="#849AA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="75" y="890" fill="#ED73BC" font-size="16" font-weight="700">ROOF + OPEN-SPACE MOTIF</text><text x="75" y="926" fill="#F4EEDD" font-size="20" font-weight="400">01  Rounded hall / plaza</text><text x="75" y="954" fill="#F4EEDD" font-size="20" font-weight="400">02  Shop foot passage</text><text x="75" y="982" fill="#F4EEDD" font-size="20" font-weight="400">03  Service-side escape</text><text x="75" y="1020" fill="#B5C7D0" font-size="17" font-weight="400">Schematic only: no scale, height or route validation.</text><text x="870" y="260" fill="#ED73BC" font-size="16" font-weight="700">PLAY</text><text x="870" y="298" fill="#F4EEDD" font-size="20" font-weight="400">The main crowd and street-chaos hub:</text><text x="870" y="325" fill="#F4EEDD" font-size="20" font-weight="400">connected shop corners, plaza</text><text x="870" y="352" fill="#F4EEDD" font-size="20" font-weight="400">crossings and foot escapes. Service</text><text x="870" y="379" fill="#F4EEDD" font-size="20" font-weight="400">parking offers smaller car clusters.</text><text x="1315" y="260" fill="#ED73BC" font-size="16" font-weight="700">ARCHITECTURE</text><text x="1315" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Short shopping blocks contain</text><text x="1315" y="325" fill="#F4EEDD" font-size="20" font-weight="400">several small plots, alongside</text><text x="1315" y="352" fill="#F4EEDD" font-size="20" font-weight="400">larger hall and plaza sites. Mixed</text><text x="1315" y="379" fill="#F4EEDD" font-size="20" font-weight="400">heights, compact infill and unequal</text><text x="1315" y="406" fill="#F4EEDD" font-size="20" font-weight="400">roof depths reveal passages and rear</text><text x="1315" y="433" fill="#F4EEDD" font-size="20" font-weight="400">courts.</text><text x="870" y="510" fill="#ED73BC" font-size="16" font-weight="700">STREETS + ROUTES</text><text x="870" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Two-lane shopping streets with</text><text x="870" y="575" fill="#F4EEDD" font-size="20" font-weight="400">generous pedestrian space meet a</text><text x="870" y="602" fill="#F4EEDD" font-size="20" font-weight="400">larger connector at selected edges.</text><text x="870" y="629" fill="#F4EEDD" font-size="20" font-weight="400">Short shop blocks, a larger</text><text x="870" y="656" fill="#F4EEDD" font-size="20" font-weight="400">hall/plaza site and narrow rear</text><text x="870" y="683" fill="#F4EEDD" font-size="20" font-weight="400">links create variety.</text><text x="1315" y="510" fill="#ED73BC" font-size="16" font-weight="700">PROP FAMILIES</text><text x="1315" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Broad sign panels, short canopies,</text><text x="1315" y="575" fill="#F4EEDD" font-size="20" font-weight="400">poster drums and low plaza seats.</text><text x="1315" y="602" fill="#F4EEDD" font-size="20" font-weight="400">Keep the foot passage and</text><text x="1315" y="629" fill="#F4EEDD" font-size="20" font-weight="400">intersection corners clear.</text><text x="870" y="760" fill="#ED73BC" font-size="16" font-weight="700">LIGHT + ACCENT PLACEMENT</text><text x="870" y="798" fill="#F4EEDD" font-size="20" font-weight="400">The strongest magenta/cyan contrast,</text><text x="870" y="825" fill="#F4EEDD" font-size="20" font-weight="400">concentrated at shop fronts and the</text><text x="870" y="852" fill="#F4EEDD" font-size="20" font-weight="400">hall. Quiet roof centres and neutral</text><text x="870" y="879" fill="#F4EEDD" font-size="20" font-weight="400">street fill preserve action.</text><text x="1315" y="760" fill="#ED73BC" font-size="16" font-weight="700">SIGNAGE + HUMOUR</text><text x="1315" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Dubious bargains and overconfident</text><text x="1315" y="825" fill="#F4EEDD" font-size="20" font-weight="400">nightlife. Sign idea: &#x27;Open Late.</text><text x="1315" y="852" fill="#F4EEDD" font-size="20" font-weight="400">Decisions Early&#x27;.</text><rect x="870" y="964" width="28" height="28" rx="4" fill="#383E62" stroke="#8296A1" stroke-width="1"/><text x="910" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Quiet roofs</text><rect x="1315" y="964" width="28" height="28" rx="4" fill="#63566C" stroke="#8296A1" stroke-width="1"/><text x="1355" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Plum shop blocks</text><rect x="870" y="1012" width="28" height="28" rx="4" fill="#ED73BC" stroke="#8296A1" stroke-width="1"/><text x="910" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Magenta frontage</text><rect x="1315" y="1012" width="28" height="28" rx="4" fill="#74E0E7" stroke="#8296A1" stroke-width="1"/><text x="1355" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Cyan anchors</text><path d="M55 1060 H1745" fill="none" stroke="#455B68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="1098" fill="#ED73BC" font-size="16" font-weight="700">LANDMARK SEED</text><text x="255" y="1098" fill="#F4EEDD" font-size="20" font-weight="400">A rounded entertainment hall with a broad luminous roof ring beside an open plaza. The ring is a location cue, not a sea</text><text x="255" y="1126" fill="#F4EEDD" font-size="20" font-weight="400">of signs.</text><text x="55" y="1190" fill="#ED73BC" font-size="16" font-weight="700">M1 RELATIONSHIP</text><text x="255" y="1190" fill="#F4EEDD" font-size="20" font-weight="400">Core identity: shops, foot passage and central plaza. Commercial frontage transitions into Ironreach&#x27;s service courts.</text><text x="55" y="1290" fill="#B5C7D0" font-size="17" font-weight="400">ALL NAMES ARE PLACEHOLDERS • Fixed blue-hour direction • Original 2D concept diagram, not game art</text></g></svg>