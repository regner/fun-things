="27" y="154" width="1.8" height="4.2" rx="0.5" fill="#F4EEDD" stroke="none" stroke-width="1"/></g><text x="630" y="807" fill="#F4EEDD" font-size="21" font-weight="400">Several shops can share a short block</text><text x="630" y="836" fill="#F4EEDD" font-size="21" font-weight="400">opposite one larger workshop site. A four-</text><text x="630" y="865" fill="#F4EEDD" font-size="21" font-weight="400">lane connector, ordinary street and narrow</text><text x="630" y="894" fill="#F4EEDD" font-size="21" font-weight="400">service link have different jobs.</text><text x="1205" y="214" fill="#FFBD74" font-size="20" font-weight="700">LARGE WAREHOUSE / YARD SITES</text><defs><clipPath id="sample2"><rect width="180" height="180"/></clipPath></defs><g transform="translate(1205 240) scale(2.888888888888889)" clip-path="url(#sample2)"><rect x="0" y="0" width="180" height="180" rx="0" fill="#203644" stroke="none" stroke-width="1"/><path d="M15 -10 V190" fill="none" stroke="#819098" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 -10 V190" fill="none" stroke="#172D40" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 94 H190" fill="none" stroke="#819098" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 94 H190" fill="none" stroke="#172D40" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 -10 V190 M15 94 H190" fill="none" stroke="#A5B2B7" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="29" y="5" width="146" height="76" rx="0" fill="#29454B" stroke="#758D8F" stroke-width="0.4"/><rect x="29" y="108" width="100" height="68" rx="0" fill="#29454B" stroke="#758D8F" stroke-width="0.4"/><rect x="136" y="108" width="40" height="68" rx="0" fill="#29454B" stroke="#758D8F" stroke-width="0.4"/><rect x="44" y="12" width="115" height="43" rx="0.8" fill="#4C627F" stroke="#ACB8BD" stroke-width="0.35"/><rect x="44" y="58" width="115" height="18" rx="0" fill="#657982" stroke="none" stroke-width="1"/><rect x="40" y="128" width="77" height="39" rx="0.8" fill="#4C627F" stroke="#ACB8BD" stroke-width="0.35"/><rect x="40" y="114" width="77" height="10" rx="0" fill="#657982" stroke="none" stroke-width="1"/><rect x="143" y="114" width="25" height="19" rx="0.8" fill="#426C74" stroke="#ACB8BD" stroke-width="0.35"/><path d="M64 58 V73" fill="none" stroke="#C2CECA" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 58 V73" fill="none" stroke="#C2CECA" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M112 58 V73" fill="none" stroke="#C2CECA" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M136 58 V73" fill="none" stroke="#C2CECA" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="33" y="61" width="1.8" height="4.2" rx="0.5" fill="#F4EEDD" stroke="none" stroke-width="1"/><rect x="33" y="68" width="1.8" height="4.2" rx="0.5" fill="#F4EEDD" stroke="none" stroke-width="1"/><rect x="141" y="146" width="1.8" height="4.2" rx="0.5" fill="#F4EEDD" stroke="none" stroke-width="1"/><rect x="145" y="146" width="1.8" height="4.2" rx="0.5" fill="#F4EEDD" stroke="none" stroke-width="1"/><rect x="17" y="42" width="1.8" height="4.2" rx="0.5" fill="#F4EEDD" stroke="none" stroke-width="1"/><rect x="113" y="95" width="1.8" height="4.2" rx="0.5" fill="#F4EEDD" stroke="none" stroke-width="1"/></g><text x="1205" y="807" fill="#F4EEDD" font-size="21" font-weight="400">Long roofs and loading aprons need much more</text><text x="1205" y="836" fill="#F4EEDD" font-size="21" font-weight="400">land. Broad two-lane freight streets provide</text><text x="1205" y="865" fill="#F4EEDD" font-size="21" font-weight="400">turning space without making every road four</text><text x="1205" y="894" fill="#F4EEDD" font-size="21" font-weight="400">lanes.</text><path d="M55 982 H1745" fill="none" stroke="#455B68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="1021" fill="#FFC580" font-size="22" font-weight="700">DISTRICT ≠ BLOCK ≠ PLOT ≠ BUILDING</text><text x="55" y="1060" fill="#F4EEDD" font-size="21" font-weight="400">Districts have unequal areas. Blocks contain different numbers and sizes of plots. Roads vary by role, including within a district.</text><text x="55" y="1148" fill="#B5C7D0" font-size="18" font-weight="400">Shared car size: 4.2 × 1.8 m • Illustration values only; final lane widths, turns and camera readability remain unvalidated.</text></g></svg>