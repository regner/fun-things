tside</text><text x="55" y="894" fill="#F4EEDD" font-size="21" font-weight="400">this crop.</text><text x="630" y="214" fill="#ED73BC" font-size="20" font-weight="700">MIXED COMMERCIAL / WORKSHOPS</text><defs><clipPath id="sample1"><rect width="180" height="180"/></clipPath></defs><g transform="translate(630 240) scale(2.888888888888889)" clip-path="url(#sample1)"><rect x="0" y="0" width="180" height="180" rx="0" fill="#203644" stroke="none" stroke-width="1"/><path d="M25 -10 V190" fill="none" stroke="#819098" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 -10 V190" fill="none" stroke="#172D40" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M21.5 -10 V190" fill="none" stroke="#A5B2B7" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M25 -10 V190" fill="none" stroke="#A5B2B7" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M28.5 -10 V190" fill="none" stroke="#A5B2B7" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M25 112 H190" fill="none" stroke="#819098" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 112 H190" fill="none" stroke="#172D40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 112 V44 H190" fill="none" stroke="#819098" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 112 V44 H190" fill="none" stroke="#172D40" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="7" width="22" height="28" rx="0" fill="#29454B" stroke="#758D8F" stroke-width="0.4"/><rect x="70" y="7" width="25" height="28" rx="0" fill="#29454B" stroke="#758D8F" stroke-width="0.4"/><rect x="45" y="43" width="49" height="54" rx="0" fill="#29454B" stroke="#758D8F" stroke-width="0.4"/><rect x="115" y="6" width="64" height="29" rx="0" fill="#29454B" stroke="#758D8F" s