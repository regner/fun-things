cap="round" stroke-linejoin="round"/><path d="M550 160.5 H570" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 655.0 200.0)"><rect x="602" y="189" width="120" height="40" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="595" y="180" width="120" height="40" rx="4" fill="#495477" stroke="#8296A1" stroke-width="1.5"/><path d="M604 190 H706" fill="none" stroke="#FFE0A3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M605 200.0 H705" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="80" y="410" width="165" height="155" rx="9" fill="#416C71" stroke="none" stroke-width="1"/><g transform="rotate(0 167.5 430.0)"><rect x="87" y="419" width="175" height="40" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="80" y="410" width="175" height="40" rx="4" fill="#495477" stroke="#8296A1" stroke-width="1.5"/><path d="M89 420 H246" fill="none" stroke="#F29183" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 430.0 H245" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 100.0 510.5)"><rect x="87" y="465" width="40" height="109" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="80" y="456" width="40" height="109" rx="4" fill="#495477" stroke="#8296A1" stroke-width="1.5"/><path d="M89 466 H111" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 510.5 H110" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 195.0 550.0)"><rect x="142" y="539" width="120" height="40" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="135" y="530" width="120" height="40" rx="4" fill="#495477" stroke="#8296A1" stroke-width="1.5"/><path d="M144 540 H246" fill="none" stroke="#FFE0A3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 550.0 H245" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="445" y="465" width="165" height="155" rx="9" fill="#416C71" stroke="none" stroke-width="1"/><g transform="rotate(0 532.5 485.0)"><rect x="452" y="474" width="175" height="40" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="445" y="465" width="175" height="40" rx="4" fill="#495477" stroke="#8296A1" stroke-width="1.5"/><path d="M454 475 H611" fill="none" stroke="#F29183" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M455 485.0 H610" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 465.0 565.5)"><rect x="452" y="520" width="40" height="109" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="445" y="511" width="40" height="109" rx="4" fill="#495477" stroke="#8296A1" stroke-width="1.5"/><path d="M454 521 H476" fill="none" stroke="#91A5B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M455 565.5 H475" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 560.0 605.0)"><rect x="507" y="594" width="120" height="40" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="500" y="585" width="120" height="40" rx="4" fill="#495477" stroke="#8296A1" stroke-width="1.5"/><path d="M509 595 H611" fill="none" stroke="#FFE0A3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M510 605.0 H610" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(0 352.5 102.5)"><rect x="297" y="84" width="125" height="55" rx="4" fill="#091B2B" stroke="none" stroke-width="1"/><rect x="290" y="75" width="125" height="55" rx="4" fill="#416C71" stroke="#8296A1" stroke-width="1.5"/><path d="M299 85 H406" fill="none" stroke="#F29183" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 102.5 H405" fill="none" stroke="#172D40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M232 230 L275 280 M286 384 L318 520 H410" fill="none" stroke="#BED0C3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 12"/></g><text x="75" y="890" fill="#F29183" font-size="16" font-weight="700">ROOF + OPEN-SPACE MOTIF</text><text x="75" y="926" fill="#F4EEDD" font-size="20" font-weight="400">01  Open-ended court</text><text x="75" y="954" fill="#F4EEDD" font-size="20" font-weight="400">02  Stepped roof bars</text><text x="75" y="982" fill="#F4EEDD" font-size="20" font-weight="400">03  Short cross-links</text><text x="75" y="1020" fill="#B5C7D0" font-size="17" font-weight="400">Schematic only: no scale, height or route validation.</text><text x="870" y="260" fill="#F29183" font-size="16" font-weight="700">PLAY</text><text x="870" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Frequent walking choices and shorter</text><text x="870" y="325" fill="#F4EEDD" font-size="20" font-weight="400">vehicle circuits. Small car courts</text><text x="870" y="352" fill="#F4EEDD" font-size="20" font-weight="400">provide local chain opportunities</text><text x="870" y="379" fill="#F4EEDD" font-size="20" font-weight="400">beside more open communal spaces.</text><text x="1315" y="260" fill="#F29183" font-size="16" font-weight="700">ARCHITECTURE</text><text x="1315" y="298" fill="#F4EEDD" font-size="20" font-weight="400">Medium and larger apartment sites</text><text x="1315" y="325" fill="#F4EEDD" font-size="20" font-weight="400">share stepped, irregular blocks. L-</text><text x="1315" y="352" fill="#F4EEDD" font-size="20" font-weight="400">and U-shaped groups surround open</text><text x="1315" y="379" fill="#F4EEDD" font-size="20" font-weight="400">courts; smaller infill breaks up the</text><text x="1315" y="406" fill="#F4EEDD" font-size="20" font-weight="400">longer roof bars.</text><text x="870" y="510" fill="#F29183" font-size="16" font-weight="700">STREETS + ROUTES</text><text x="870" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Two-lane neighbourhood streets and</text><text x="870" y="575" fill="#F4EEDD" font-size="20" font-weight="400">narrow access lanes serve unequal</text><text x="870" y="602" fill="#F4EEDD" font-size="20" font-weight="400">apartment sites. Short cross-links</text><text x="870" y="629" fill="#F4EEDD" font-size="20" font-weight="400">and open courts break up longer</text><text x="870" y="656" fill="#F4EEDD" font-size="20" font-weight="400">blocks.</text><text x="1315" y="510" fill="#F29183" font-size="16" font-weight="700">PROP FAMILIES</text><text x="1315" y="548" fill="#F4EEDD" font-size="20" font-weight="400">Laundry frames, planters, benches</text><text x="1315" y="575" fill="#F4EEDD" font-size="20" font-weight="400">and small play markings. Keep tall</text><text x="1315" y="602" fill="#F4EEDD" font-size="20" font-weight="400">foliage and furniture out of passage</text><text x="1315" y="629" fill="#F4EEDD" font-size="20" font-weight="400">mouths.</text><text x="870" y="760" fill="#F29183" font-size="16" font-weight="700">LIGHT + ACCENT PLACEMENT</text><text x="870" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Soft teal-blue ambient fill with</text><text x="870" y="825" fill="#F4EEDD" font-size="20" font-weight="400">warm entrances. Coral marks shared</text><text x="870" y="852" fill="#F4EEDD" font-size="20" font-weight="400">corners and local shops rather than</text><text x="870" y="879" fill="#F4EEDD" font-size="20" font-weight="400">every roof edge.</text><text x="1315" y="760" fill="#F29183" font-size="16" font-weight="700">SIGNAGE + HUMOUR</text><text x="1315" y="798" fill="#F4EEDD" font-size="20" font-weight="400">Optimistic communal rules. Sign</text><text x="1315" y="825" fill="#F4EEDD" font-size="20" font-weight="400">idea: &#x27;Shared Space. Individual</text><text x="1315" y="852" fill="#F4EEDD" font-size="20" font-weight="400">Opinions&#x27;.</text><rect x="870" y="964" width="28" height="28" rx="4" fill="#495477" stroke="#8296A1" stroke-width="1"/><text x="910" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Blue-grey roofs</text><rect x="1315" y="964" width="28" height="28" rx="4" fill="#416C71" stroke="#8296A1" stroke-width="1"/><text x="1355" y="985" fill="#B5C7D0" font-size="18" font-weight="400">Teal courts</text><rect x="870" y="1012" width="28" height="28" rx="4" fill="#F29183" stroke="#8296A1" stroke-width="1"/><text x="910" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Coral corners</text><rect x="1315" y="1012" width="28" height="28" rx="4" fill="#FFE0A3" stroke="#8296A1" stroke-width="1"/><text x="1355" y="1033" fill="#B5C7D0" font-size="18" font-weight="400">Warm entrances</text><path d="M55 1060 H1745" fill="none" stroke="#455B68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="1098" fill="#F29183" font-size="16" font-weight="700">LANDMARK SEED</text><text x="255" y="1098" fill="#F4EEDD" font-size="20" font-weight="400">A stepped apartment group wrapping a broad, open-ended communal court with one large circular paving motif.</text><text x="55" y="1190" fill="#F29183" font-size="16" font-weight="700">M1 RELATIONSHIP</text><text x="255" y="1190" fill="#F4EEDD" font-size="20" font-weight="400">Borrow the open-court idea for the housing pocket without adding a full apartment district.</text><text x="55" y="1290" fill="#B5C7D0" font-size="17" font-weight="400">ALL NAMES ARE PLACEHOLDERS • Fixed blue-hour direction • Original 2D concept diagram, not game art</text></g></svg>