<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000">
  <title>Provisional six-block city plan with high-rises</title>
  <desc>A 260 by 163 metre street-and-block envelope with a 12 metre perimeter buffer.
  Six 64 by 56 metre blocks form two rows and three columns. Streets have nine metre
  carriageways and four metre sidewalks. Shops and an office tower are northwest;
  a plaza is north centre; homes and an apartment tower are northeast. Workshops,
  depot and open car yard occupy the southern row. Three proposed saved sectors
  divide the district at the inner vertical street centre lines. Foot shortcut,
  service alley, four candidate spawn recesses and two yard entrances are shown.
  All dimensions and placements are concept proposals requiring movement and camera proofs.</desc>
