[tools]
node = "24"
python = "3.14.2"
# Keep this version aligned with .gdstyle-version, used by CI.
[tools."github:atelico/gdstyle"]
version = "0.3.0"
matching_regex = '^gdstyle-(x86_64|aarch64)-'

# Development builds are published separately from Godot's stable releases.
[tools."github:godotengine/godot-builds"]
version = "4.8-dev7"
matching_regex = '^Godot_v.*_(linux\.|win|macos)'
rename_exe = { "Godot_v*" = "godot" }

[tools."github:godotengine/godot-builds".platforms]
# Pin the 64-bit Windows build: the generic regex also matches win32, whose 2 GB address space
# crashes the windowed editor during startup ("Parameter mem is null").
windows-x64 = { asset_pattern = "Godot_v*_win64.exe.zip" }
macos-x64 = { bin_path = "Godot.app/Contents/MacOS", strip_components = 0, rename_exe = { "Godot" = "godot" } }
macos-arm64 = { bin_path = "Godot.app/Contents/MacOS", strip_components = 0, rename_exe = { "Godot" = "godot" } }

[tasks.editor]
description = "Open the project in the pinned Godot editor"
run = "godot --editor --path ."

[tasks.play]
description = "Run the project with the pinned Godot version"
run = "godot --path ."

[tasks."gdstyle:check"]
description = "Lint owned scripts; preserve comments/spacing through manual review"
run = "python tools/script_checks.py --style-only"

[tasks."gdscript:check"]
description = "Explicitly compile every owned script, including unused scripts"
run = "python tools/script_checks.py"

[tasks."tools:check"]
description = "Run production repository-tool tests"
run = "python -m unittest discover -s tools -p '*test*.py'"

[tasks."production:check"]
description = "Run owned script, Python, and GUT production checks"
run = "python tools/production_checks.py"
